<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">Retro Universe</title><desc id="desc">Animated 3D 8-bit arcade logo with a pixel planet and orbit.</desc>
<defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff16b"/><stop offset=".48" stop-color="#ffb51b"/><stop offset="1" stop-color="#ff552f"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#63f4ff"/><stop offset=".55" stop-color="#178bff"/><stop offset="1" stop-color="#4434e9"/></linearGradient><linearGradient id="planet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70f8ff"/><stop offset=".5" stop-color="#1884ff"/><stop offset="1" stop-color="#3525b5"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g class="orbit" fill="none" stroke="#ff48d1" stroke-width="13"><ellipse cx="450" cy="157" rx="355" ry="83" transform="rotate(-12 450 157)"/></g>
<g transform="translate(95 17)"><circle cx="115" cy="77" r="52" fill="#07102b" stroke="#f8f0cf" stroke-width="5"/><circle cx="115" cy="77" r="47" fill="url(#planet)"/><path d="M75 57h24v14H85v12h-8zm48-20h20v12h-9v11h-13zm-23 54h22v13h-22zm29 18h23v12h-23z" fill="#54ff7a"/><path d="M74 77h25v10H74zm42-36h16v10h-16zM135 84h23v13h-23z" fill="#ffde4d"/><ellipse cx="115" cy="77" rx="77" ry="22" fill="none" stroke="#ff4bd5" stroke-width="10" transform="rotate(-22 115 77)"/></g>
<g font-family="monospace" font-weight="1000" text-anchor="middle" paint-order="stroke fill" stroke-linejoin="miter">
<text x="510" y="150" font-size="105" letter-spacing="2" fill="#120c34" stroke="#120c34" stroke-width="20" transform="translate(0 18)">RETRO</text>
<text x="510" y="150" font-size="105" letter-spacing="2" fill="#6b173e" stroke="#6b173e" stroke-width="13" transform="translate(0 12)">RETRO</text>
<text x="510" y="150" font-size="105" letter-spacing="2" fill="url(#gold)" stroke="#fff3a0" stroke-width="4">RETRO</text>
<text x="510" y="263" font-size="91" letter-spacing="-2" fill="#100b35" stroke="#100b35" stroke-width="22" transform="translate(0 18)">UNIVERSE</text>
<text x="510" y="263" font-size="91" letter-spacing="-2" fill="#14218d" stroke="#14218d" stroke-width="14" transform="translate(0 11)">UNIVERSE</text>
<text x="510" y="263" font-size="91" letter-spacing="-2" fill="url(#blue)" stroke="#b1ffff" stroke-width="4">UNIVERSE</text>
</g><g fill="#fff3a0" filter="url(#glow)"><path d="M784 46h12v12h-12zM813 78h8v8h-8zM178 220h12v12h-12zM746 290h10v10h-10z"/></g>
<style>@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes orbitGlow{0%,100%{opacity:.78;stroke-width:11}50%{opacity:1;stroke-width:15}}text{animation:bob 3s ease-in-out infinite}.orbit{transform-origin:450px 157px;animation:orbitGlow 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){text,.orbit{animation:none}}</style>
</svg>
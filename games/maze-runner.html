<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maze Runner — Retro Universe</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../style.css"><style>.board{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:2px;width:min(94vw,480px);margin:16px auto}.cell{aspect-ratio:1;background:#223960;border:1px solid #30496d}.wall{background:#62d6e8}.player{background:#f8d848!important}.goal{background:#78c850!important}.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.pad button{min-width:54px;min-height:48px}</style><link rel="manifest" href="../manifest.webmanifest"></head><body data-game="maze-runner"><header><a class="brand" href="../index.html" aria-label="Retro Universe home"><img class="brand-logo" src="../assets/retro-universe-logo.svg" alt="Retro Universe"></a><span>MAZE QUEST</span><a href="../index.html">← ARCADE</a></header><main class="game-wrap"><p class="eyebrow">/// FIND THE EXIT</p><h1>MAZE <em>RUNNER</em></h1><p>Collect the key (gold), then reach the green exit. Arrow keys/WASD or touch buttons.</p><h3 id="status">FIND THE KEY!</h3><div id="board" class="board" aria-label="Maze"></div><div class="pad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button><button id="new">NEW MAZE</button></div></main><footer>RETRO UNIVERSE · <a href="../index.html">ARCADE HOME ↑</a></footer><script>const N=15,board=document.querySelector('#board'),statusEl=document.querySelector('#status');let map,px,py,key=false,done=false;function make(){map=Array.from({length:N},()=>Array(N).fill(1));function carve(x,y){map[y][x]=0;let ds=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5);for(const [dx,dy] of ds){let nx=x+dx,ny=y+dy;if(nx>0&&ny>0&&nx<N-1&&ny<N-1&&map[ny][nx]){map[y+dy/2][x+dx/2]=0;carve(nx,ny)}}}carve(1,1);map[1][1]=0;map[N-2][N-2]=0;map[1][N-2]=0;px=1;py=1;key=false;done=false;draw()}function draw(){board.innerHTML='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){let d=document.createElement('div');d.className='cell'+(map[y][x]?' wall':'')+(x===px&&y===py?' player':'')+(x===N-2&&y===N-2?' goal':'')+(x===N-2&&y===1&&!key?' goal':'');if(x===N-2&&y===1&&!key)d.style.background='#f8d848';board.append(d)}statusEl.textContent=done?'MAZE CLEARED! PRESS NEW MAZE':key?'KEY FOUND — FIND THE EXIT!':'FIND THE GOLD KEY!'}function move(dx,dy){if(done)return;let nx=px+dx,ny=py+dy;if(nx<0||ny<0||nx>=N||ny>=N||map[ny][nx])return;px=nx;py=ny;if(px===N-2&&py===1)key=true;if(px===N-2&&py===N-2&&key)done=true;draw()}addEventListener('keydown',e=>{let d={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>({up:()=>move(0,-1),down:()=>move(0,1),left:()=>move(-1,0),right:()=>move(1,0)}[b.dataset.dir])());document.querySelector('#new').onclick=make;make()</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{})</script><script>(()=>{const id=document.body.dataset.game;try{let played=JSON.parse(localStorage.getItem('retro-played')||'[]');if(!Array.isArray(played))played=[];if(!played.includes(id))played.push(id);localStorage.setItem('retro-played',JSON.stringify(played));let recent=JSON.parse(localStorage.getItem('retro-recent')||'[]');if(!Array.isArray(recent))recent=[];localStorage.setItem('retro-recent',JSON.stringify([id,...recent.filter(x=>x!==id)].slice(0,8)));const d=new Date().toISOString().slice(0,10),list=['tetris','snake','2048','tic-tac-toe','racer','space-shooter','breakout','memory-match','platformer','maze-runner','pong','minesweeper','simon'];if(id===list[Number(d.replace(/-/g,''))%list.length])localStorage.setItem('retro-daily-complete',JSON.stringify(d))}catch(e){}})()</script><script src="../js/game-enhancements.js"></script><script src="../js/arcade-system.js"></script></body></html>

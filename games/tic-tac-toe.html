<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Toe · Retro Universe</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../style.css"></head><body data-game="tic-tac-toe"><header><a class="brand" href="../index.html" aria-label="Retro Universe home"><img class="brand-logo" src="../assets/retro-universe-logo.svg" alt="Retro Universe"></a><span>8-BIT ARCADE · PLAYER 1</span><a href="../index.html">← ARCADE</a></header><main class="game-shell"><a class="back" href="../index.html">← GAME SELECT</a><h1>TIC TAC <em>TOE</em></h1><p class="muted">Two-player pixel classic. Take turns and get three in a row.</p><div class="panel"><p class="status" id="status">PLAYER X — YOUR MOVE</p><div class="board" id="board"></div><div class="controls"><button id="reset">↻ NEW ROUND</button><button id="score-reset">RESET SCORE</button></div><p class="note" id="score">X: 0 wins · O: 0 wins · Draws: 0</p></div></main><script>const board=document.querySelector('#board'),status=document.querySelector('#status'),scoreEl=document.querySelector('#score');let cells=Array(9).fill(''),turn='X',over=false,wins={X:0,O:0,D:0};const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function draw(){board.innerHTML='';cells.forEach((v,i)=>{let b=document.createElement('button');b.className='cell '+(v==='O'?'o':'');b.textContent=v;b.disabled=!!v||over;b.onclick=()=>play(i);board.append(b)});scoreEl.textContent='X: '+wins.X+' wins · O: '+wins.O+' wins · Draws: '+wins.D}function play(i){if(over||cells[i])return;cells[i]=turn;if(lines.some(a=>a.every(n=>cells[n]===turn))){over=true;wins[turn]++;status.textContent='PLAYER '+turn+' WINS! ★'}else if(cells.every(Boolean)){over=true;wins.D++;status.textContent='DRAW GAME!'}else{turn=turn==='X'?'O':'X';status.textContent='PLAYER '+turn+' — YOUR MOVE'}draw()}function reset(){cells=Array(9).fill('');turn='X';over=false;status.textContent='PLAYER X — YOUR MOVE';draw()}document.querySelector('#reset').onclick=reset;document.querySelector('#score-reset').onclick=()=>{wins={X:0,O:0,D:0};reset()};draw();</script><footer>RETRO UNIVERSE · PLAYER 1 <a href="../index.html">BACK TO ARCADE ↑</a></footer><script>(()=>{const id=document.body.dataset.game;if(!id)return;try{const read=k=>JSON.parse(localStorage.getItem(k)||'[]');let played=read('retro-played');if(!Array.isArray(played))played=[];if(!played.includes(id))played.push(id);localStorage.setItem('retro-played',JSON.stringify(played));let recent=read('retro-recent');if(!Array.isArray(recent))recent=[];recent=[id,...recent.filter(x=>x!==id)].slice(0,8);localStorage.setItem('retro-recent',JSON.stringify(recent));const day=new Date().toISOString().slice(0,10),daily=['tetris','snake','2048','tic-tac-toe','racer','space-shooter','breakout','memory-match'][Number(day.replace(/-/g,''))%8];if(id===daily)localStorage.setItem('retro-daily-complete',JSON.stringify(day))}catch(e){}})()</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}))}</script><script src="../js/game-enhancements.js"></script></body></html>

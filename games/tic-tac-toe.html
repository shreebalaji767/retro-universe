<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Toe · Retro Universe</title><link rel="stylesheet" href="../style.css"></head><body><header><a href="../index.html"><b>RU</b> RETRO UNIVERSE</a><a href="../index.html">← ARCADE</a></header><main class="game-shell"><a class="back" href="../index.html">← GAME SELECT</a><h1>TIC TAC <em>TOE</em></h1><p class="muted">Two-player pixel classic. Take turns and get three in a row.</p><div class="panel"><p class="status" id="status">PLAYER X — YOUR MOVE</p><div class="board" id="board"></div><div class="controls"><button id="reset">↻ NEW ROUND</button><button id="score-reset">RESET SCORE</button></div><p class="note" id="score">X: 0 wins · O: 0 wins · Draws: 0</p></div></main><script>const board=document.querySelector('#board'),status=document.querySelector('#status'),scoreEl=document.querySelector('#score');let cells=Array(9).fill(''),turn='X',over=false,wins={X:0,O:0,D:0};const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function draw(){board.innerHTML='';cells.forEach((v,i)=>{let b=document.createElement('button');b.className='cell '+(v==='O'?'o':'');b.textContent=v;b.disabled=!!v||over;b.onclick=()=>play(i);board.append(b)});scoreEl.textContent='X: '+wins.X+' wins · O: '+wins.O+' wins · Draws: '+wins.D}function play(i){if(over||cells[i])return;cells[i]=turn;if(lines.some(a=>a.every(n=>cells[n]===turn))){over=true;wins[turn]++;status.textContent='PLAYER '+turn+' WINS! ★'}else if(cells.every(Boolean)){over=true;wins.D++;status.textContent='DRAW GAME!'}else{turn=turn==='X'?'O':'X';status.textContent='PLAYER '+turn+' — YOUR MOVE'}draw()}function reset(){cells=Array(9).fill('');turn='X';over=false;status.textContent='PLAYER X — YOUR MOVE';draw()}document.querySelector('#reset').onclick=reset;document.querySelector('#score-reset').onclick=()=>{wins={X:0,O:0,D:0};reset()};draw();</script></body></html>

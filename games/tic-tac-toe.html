rray(9).fill(""),turn="X",over=false,thinking=false,wins={X:0,O:0,D:0};const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function result(){for(const line of lines)if(cells[line[0]]&&line.every(i=>cells[i]===cells[line[0]]))return cells[line[0]];return cells.every(Boolean)?"D":""}function draw(){board.innerHTML="";cells.forEach((v,i)=>{const b=document.createElement("button");b.className="cell "+(v==="O"?"o":"");b.textContent=v;b.setAttribute("aria-label","Cell "+(i+1)+(v?", "+v:" empty"));b.disabled=!!v||over||thinking||(modeEl.value==="cpu"&&turn==="O");b.onclick=()=>play(i);board.append(b)});scoreEl.textContent="X: "+wins.X+" wins · O: "+wins.O+" wins · Draws: "+wins.D}function finishIfNeeded(){const r=result();if(!r)return false;over=true;if(r==="D"){wins.D++;status.textContent="DRAW GAME!"}else{wins[r]++;status.textContent=r==="O"&&modeEl.value==="cpu"?"COMPUTER WINS!":"PLAYER "+r+" WINS! ★"}draw();return true}function play(i){if(over||thinking||cells[i]||(modeEl.value==="cpu"&&turn==="O"))return;cells[i]=turn;if(finishIfNeeded())return;turn=turn==="X"?"O":"X";if(modeEl.value==="cpu"&&turn==="O"){thinking=true;status.textContent="COMPUTER THINKING…";draw();setTimeout(()=>{const move=window.RetroGame?RetroGame.chooseTicTacToeMove(cells,"O","X",difficultyEl.value):cells.findIndex(v=>!v);if(move>=0)cells[move]="O";thinking=false;if(!finishIfNeeded()){turn="X";status.textContent="YOUR TURN — X";draw()}},280)}else{status.textContent="PLAYER "+turn+" — YOUR MOVE";draw()}}function reset(){cells=Array(9).fill("");turn="X";over=false;thinking=false;status.textContent=modeEl.value==="cpu"?"YOUR TURN — X":"PLAYER X — YOUR MOVE";draw()}document.querySelector("#reset").onclick=reset;document.querySelector("#score-reset").onclick=()=>{wins={X:0,O:0,D:0};reset()};modeEl.onchange=()=>{difficultyEl.disabled=modeEl.value==="two";reset()};difficultyEl.disabled=modeEl.value==="two";draw();</script><footer>RETRO UNIVERSE · PLAYER 1 <a href="../index.html">BACK TO ARCADE ↑</a></footer><script>(()=>{const id=document.body.dataset.game;if(!id)return;try{const read=k=>JSON.parse(localStorage.getItem(k)||'[]');let played=read('retro-played');if(!Array.isArray(played))played=[];if(!played.includes(id))played.push(id);localStorage.setItem('retro-played',JSON.stringify(played));let recent=read('retro-recent');if(!Array.isArray(recent))recent=[];recent=[id,...recent.filter(x=>x!==id)].slice(0,8);localStorage.setItem('retro-recent',JSON.stringify(recent));const day=new Date().toISOString().slice(0,10),daily=['tetris','snake','2048','tic-tac-toe','racer','space-shooter','breakout','memory-match'][Number(day.replace(/-/g,''))%8];if(id===daily)localStorage.setItem('retro-daily-complete',JSON.stringify(day))}catch(e){}})()</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}))}</script><script src="../js/game-enhancements.js"></script></body></html>

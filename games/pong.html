<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Pong — Retro Universe</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../style.css"><style>.field{display:block;width:100%;max-width:720px;aspect-ratio:3/2;background:#101b35;border:4px solid var(--line);touch-action:none}.pad{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px}.pad button{min-height:48px;min-width:68px}.touch-p2{display:none}.touch-p2.active{display:flex}.touch-p2,.touch-p1{justify-content:center;gap:8px;flex-wrap:wrap;margin:8px}</style><link rel="manifest" href="../manifest.webmanifest"></head><body data-game="pong"><header><a class="brand" href="../index.html" aria-label="Retro Universe home"><img class="brand-logo" src="../assets/retro-universe-logo.svg" alt="Retro Universe"></a><span>ARCADE CLASSIC</span><a href="../index.html">← ARCADE</a></header><main style="max-width:780px;margin:auto;padding:18px"><p class="eyebrow">/// LOCAL MULTIPLAYER / VS COMPUTER</p><h1>PIXEL <em>PONG</em></h1><p id="instructions">Player 1: W/S · Player 2: ↑/↓. First to 7 wins.</p><label for="mode">PLAY MODE </label><select id="mode" aria-label="Play mode"><option value="local">LOCAL 2 PLAYERS</option><option value="cpu">VS COMPUTER</option></select><h3 id="score">PLAYER 1 0 — 0 PLAYER 2</h3><canvas id="c" class="field" width="720" height="480"></canvas><div class="pad touch-p1"><strong>PLAYER 1</strong><button data-dir="up">▲ UP</button><button data-dir="down">▼ DOWN</button></div><div class="pad touch-p2 active" id="touch-p2"><strong>PLAYER 2</strong><button data-dir2="up">▲ UP</button><button data-dir2="down">▼ DOWN</button></div><div class="pad"><button id="restart">↻ NEW MATCH</button></div></main><footer>RETRO UNIVERSE · <a href="../index.html">ARCADE HOME ↑</a></footer><script>const c=document.querySelector('#c'),g=c.getContext('2d'),score=document.querySelector('#score');let py=190,cy=190,bx=360,by=240,vx=4,vy=2,ps=0,cs=0,keys={},running=true,mode='local';function serve(dir){bx=360;by=240;vx=4*dir;vy=(Math.random()-.5)*5}function draw(){g.fillStyle='#101b35';g.fillRect(0,0,720,480);g.fillStyle='#30496d';for(let y=0;y<480;y+=24)g.fillRect(357,y,6,12);g.fillStyle='#78c850';g.fillRect(24,py,14,100);g.fillStyle='#e84a5f';g.fillRect(682,cy,14,100);g.fillStyle='#f8d848';g.fillRect(bx-8,by-8,16,16);g.fillStyle='#fff0c2';g.font='28px monospace';g.fillText(ps,290,45);g.fillText(cs,420,45)}function loop(){if(running){py=Math.max(0,Math.min(380,py+((keys.s||keys.down)?5:0)-((keys.w||keys.up)?5:0)));if(mode==='cpu'){cy+=((by-50)-(cy+50))*.07}else{cy=Math.max(0,Math.min(380,cy+((keys.ArrowDown||keys.down2)?5:0)-((keys.ArrowUp||keys.up2)?5:0))) }bx+=vx;by+=vy;if(by<8||by>472)vy*=-1;if(vx<0&&bx<44&&by>py&&by<py+100){vx=Math.abs(vx)*1.04;vy+=(by-(py+50))*.08}if(vx>0&&bx>674&&by>cy&&by<cy+100){vx=-Math.abs(vx)*1.04;vy+=(by-(cy+50))*.08}if(bx<0){cs++;serve(1)}if(bx>720){ps++;serve(-1)}if(ps>=7||cs>=7){running=false;score.textContent=(ps>cs?'PLAYER 1 WINS! ':'PLAYER 2 WINS! ')+'FINAL '+ps+' — '+cs}else score.textContent=(mode==='cpu'?'YOU '+ps+' — '+cs+' CPU':'PLAYER 1 '+ps+' — '+cs+' PLAYER 2');draw()}if(running)requestAnimationFrame(loop)}addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown'].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-dir]').forEach(b=>{b.onpointerdown=()=>keys[b.dataset.dir]=true;['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[b.dataset.dir]=false))});document.querySelectorAll('[data-dir2]').forEach(b=>{b.onpointerdown=()=>keys[b.dataset.dir2+'2']=true;['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[b.dataset.dir2+'2']=false))});c.addEventListener('pointermove',e=>{if(e.buttons){const r=c.getBoundingClientRect();py=Math.max(0,Math.min(380,(e.clientY-r.top)*480/r.height-50))}});document.querySelector('#mode').addEventListener('change',()=>{mode=document.querySelector('#mode').value;document.querySelector('#instructions').textContent=mode==='cpu'?'Move with W/S, touch buttons or drag. Computer controls the right paddle.':'Player 1: W/S or left touch buttons · Player 2: ↑/↓ or right touch buttons. First to 7 wins.';document.querySelector('#touch-p2').classList.toggle('active',mode==='local');document.querySelector('#restart').click()});document.querySelector('#restart').onclick=()=>{ps=cs=0;py=cy=190;running=true;mode=document.querySelector('#mode').value;serve(Math.random()<.5?1:-1);loop()};mode=document.querySelector('#mode').value;serve(1);loop()</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{})</script><script>(()=>{const id=document.body.dataset.game;try{let played=JSON.parse(localStorage.getItem('retro-played')||'[]');if(!Array.isArray(played))played=[];if(!played.includes(id))played.push(id);localStorage.setItem('retro-played',JSON.stringify(played));let recent=JSON.parse(localStorage.getItem('retro-recent')||'[]');if(!Array.isArray(recent))recent=[];localStorage.setItem('retro-recent',JSON.stringify([id,...recent.filter(x=>x!==id)].slice(0,8)));const d=new Date().toISOString().slice(0,10),list=['tetris','snake','2048','tic-tac-toe','racer','space-shooter','breakout','memory-match','platformer','maze-runner','pong','minesweeper','simon'];if(id===list[Number(d.replace(/-/g,''))%list.length])localStorage.setItem('retro-daily-complete',JSON.stringify(d))}catch(e){}})()</script><script src="../js/game-enhancements.js"></script><script src="../js/arcade-system.js"></script><script src="../js/universal-controls.js"></script></body></html>

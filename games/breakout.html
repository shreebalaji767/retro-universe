<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b35"><title>Brick Breaker · Retro Universe</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../style.css"><link rel="manifest" href="../manifest.webmanifest"></head><body data-game="breakout"><header><a class="brand" href="../index.html" aria-label="Retro Universe home"><img class="brand-logo" src="../assets/retro-universe-logo.svg" alt="Retro Universe"></a><span>8-BIT ARCADE</span><a href="../index.html">← ARCADE</a></header><main class="game-shell"><a class="back" href="../index.html">← GAME SELECT</a><h1>BRICK <em>BREAKER</em></h1><p class="muted">Clear every brick. Keep the ball in play with your paddle.</p><section class="panel"><div class="hud"><span>SCORE <b id="score">0</b></span><span id="status">PRESS START</span><span>LIVES <b id="lives">3</b></span></div><canvas id="game" width="360" height="480" aria-label="Brick breaker game"></canvas><div class="controls"><button id="start">▶ START / RESTART</button><button data-dir="-1">◀ LEFT</button><button data-dir="1">RIGHT ▶</button></div><p class="note">Keyboard: ← → / A D. On phones, use buttons or drag across the board.</p></section></main><footer>RETRO UNIVERSE · PLAYER 1 <a href="../index.html">BACK TO ARCADE ↑</a></footer>
<script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d');let paddle=145,ball={x:180,y:400,vx:2.3,vy:-3},bricks=[],score=0,lives=3,stage=1,running=false,raf,keys={};function loadBricks(){bricks=[];for(let r=0;r<5;r++)for(let col=0;col<8;col++)bricks.push({x:10+col*43,y:45+r*25,alive:true,color:['#e84a5f','#f4c84a','#42b6a5','#5b75d1','#f0a6ca'][(r+stage-1)%5],hits:stage>=3&&r===0?2:1})}function reset(){cancelAnimationFrame(raf);paddle=145;stage=1;ball={x:180,y:400,vx:2.3,vy:-3};loadBricks();score=0;lives=3;running=true;document.querySelector('#score').textContent=0;document.querySelector('#lives').textContent=3;document.querySelector('#status').textContent='LEVEL 1 / 5';raf=requestAnimationFrame(loop)}function draw(){ctx.fillStyle='#101b35';ctx.fillRect(0,0,360,480);bricks.forEach(b=>{if(!b.alive)return;ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,38,17);if(b.hits>1){ctx.fillStyle='#fff0c2';ctx.fillRect(b.x+12,b.y+7,14,3)}ctx.fillStyle='#fff0c2';ctx.fillRect(b.x+3,b.y+3,32,3)});ctx.fillStyle='#fff0c2';ctx.fillRect(paddle,445,70,10);ctx.fillStyle='#f4c84a';ctx.fillRect(ball.x-6,ball.y-6,12,12);if(!running){ctx.fillStyle='#101b35dd';ctx.fillRect(35,200,290,78);ctx.fillStyle='#fff0c2';ctx.textAlign='center';ctx.font='bold 18px monospace';ctx.fillText(bricks.every(b=>!b.alive)?'YOU WIN!':score?'GAME OVER':'READY PLAYER ONE',180,232);ctx.font='12px monospace';ctx.fillText('PRESS START',180,255)}}function loop(){if(!running)return;if(keys.left)paddle-=5;if(keys.right)paddle+=5;paddle=Math.max(0,Math.min(290,paddle));ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<6||ball.x>354)ball.vx*=-1;if(ball.y<6)ball.vy=Math.abs(ball.vy);if(ball.vy>0&&ball.y>435&&ball.y<460&&ball.x>paddle-3&&ball.x<paddle+73){ball.vy=-Math.abs(ball.vy);ball.vx=((ball.x-(paddle+35))/35)*3.5}for(const b of bricks){if(b.alive&&ball.x>b.x-6&&ball.x<b.x+44&&ball.y>b.y-6&&ball.y<b.y+23){b.hits--;if(b.hits<=0)b.alive=false;ball.vy*=-1;score+=10;document.querySelector('#score').textContent=score;break}}if(ball.y>490){lives--;document.querySelector('#lives').textContent=lives;if(lives<=0){running=false;document.querySelector('#status').textContent='GAME OVER'}else ball={x:180,y:400,vx:2.3,vy:-3}}if(bricks.every(b=>!b.alive)){if(stage<5){stage++;loadBricks();ball={x:180,y:400,vx:(Math.random()<.5?-1:1)*(2.3+stage*.25),vy:-(3+stage*.3)};paddle=145;document.querySelector('#status').textContent='LEVEL '+stage+' / 5';}else{running=false;document.querySelector('#status').textContent='CHAMPION! 5/5'}}draw();if(running)raf=requestAnimationFrame(loop)}document.querySelector('#start').onclick=reset;document.querySelectorAll('[data-dir]').forEach(b=>{const k=b.dataset.dir==='-1'?'left':'right';b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});document.onkeydown=e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','a','d'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true};document.onkeyup=e=>{let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false};let touch;c.onpointerdown=e=>{touch=true;const r=c.getBoundingClientRect();paddle=(e.clientX-r.left)/r.width*360-35};c.onpointermove=e=>{if(touch){const r=c.getBoundingClientRect();paddle=(e.clientX-r.left)/r.width*360-35}};c.onpointerup=()=>touch=false;draw()})();
</script><script>(()=>{const id=document.body.dataset.game;if(!id)return;try{const read=k=>JSON.parse(localStorage.getItem(k)||'[]');let played=read('retro-played');if(!Array.isArray(played))played=[];if(!played.includes(id))played.push(id);localStorage.setItem('retro-played',JSON.stringify(played));let recent=read('retro-recent');if(!Array.isArray(recent))recent=[];recent=[id,...recent.filter(x=>x!==id)].slice(0,8);localStorage.setItem('retro-recent',JSON.stringify(recent));const day=new Date().toISOString().slice(0,10),daily=['tetris','snake','2048','tic-tac-toe','racer','space-shooter','breakout','memory-match'][Number(day.replace(/-/g,''))%8];if(id===daily)localStorage.setItem('retro-daily-complete',JSON.stringify(day))}catch(e){}})()</script><script src="../js/game-enhancements.js"></script><script src="../js/arcade-system.js"></script><script src="../js/universal-controls.js"></script></body></html>

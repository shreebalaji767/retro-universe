<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b35"><title>Pixel Crossing — Retro Universe</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../style.css"><style>.board{display:block;width:100%;max-width:520px;aspect-ratio:1;background:#101b35;border:4px solid var(--line);image-rendering:pixelated;touch-action:manipulation}.pad{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:6px;margin:12px}.pad button{min-height:48px;touch-action:manipulation}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.pad button:nth-child(5){grid-column:2;grid-row:3}</style></head><body data-game="frogger"><header><a class="brand" href="../index.html"><b>RU</b> RETRO UNIVERSE</a><span>PIXEL CHALLENGE</span><a href="../index.html">← ARCADE</a></header><main style="max-width:640px;margin:auto;padding:18px"><p class="eyebrow">/// CROSS THE CHAOS</p><h1>PIXEL <em>CROSSING</em></h1><p>Reach the five safe bays at the top. Dodge traffic and ride the logs. Use arrow keys, WASD or the buttons.</p><h3 id="hud">SCORE 0 · LIVES 3 · HOMES 0/5</h3><canvas id="board" class="board" width="520" height="520" aria-label="Pixel Crossing game"></canvas><div class="pad"><button data-move="0,-1">▲</button><button data-move="-1,0">◀</button><button data-move="0,0" id="wait">●</button><button data-move="1,0">▶</button><button data-move="0,1">▼</button></div><button id="restart">↻ NEW GAME</button></main><footer>RETRO UNIVERSE · <a href="../index.html">ARCADE HOME ↑</a></footer><script>
const c=document.querySelector('#board'),x=c.getContext('2d'),hud=document.querySelector('#hud');const S=40;let frog,homes,lives,score,rows,tick,over,keys={},lastMove=0;function setup(){frog={x:6,y:12};homes=[];lives=3;score=0;tick=0;over=false;rows=[];for(let y=1;y<=4;y++)rows[y]={type:'water',dir:y%2?1:-1,speed:.018+y*.004,objs:Array.from({length:3},(_,i)=>({x:i*5+rnd(),len:2+(i%2)}))};for(let y=6;y<=10;y++)rows[y]={type:'road',dir:y%2?1:-1,speed:.025+(y%3)*.008,objs:Array.from({length:3},(_,i)=>({x:i*5+Math.random()*2,len:y%2?1:1.4}))};draw();requestAnimationFrame(loop)}function rnd(){return Math.random()*2}function move(dx,dy){if(over)return;if(dx===0&&dy===0)return;frog.x=Math.max(0,Math.min(12,frog.x+dx));frog.y=Math.max(0,Math.min(12,frog.y+dy));if(frog.y===0){if(![0,3,6,9,12].includes(frog.x)||homes.includes(frog.x)){lose()}else{homes.push(frog.x);score+=100;frog={x:6,y:12};if(homes.length===5){score+=500;homes=[]}}}draw()}function lose(){lives--;frog={x:6,y:12};if(lives<=0)over=true}function loop(){if(!over){tick++;for(let y=1;y<=10;y++){let row=rows[y];row.objs.forEach(o=>{o.x+=row.dir*row.speed;if(o.x>13)o.x=-o.len;if(o.x<-o.len)o.x=13})}if(frog.y>0&&frog.y<5){let row=rows[frog.y],log=row.objs.find(o=>frog.x>=o.x&&frog.x<o.x+o.len);if(log){frog.x+=row.dir*row.speed;if(frog.x<0||frog.x>12)lose()}else if(tick%6===0)lose()}if(frog.y>=6&&frog.y<=10){const row=rows[frog.y];if(row.objs.some(o=>frog.x>=o.x-.25&&frog.x<o.x+o.len))lose()}if(keys.ArrowUp||keys.w||keys.ArrowDown||keys.s||keys.ArrowLeft||keys.a||keys.ArrowRight||keys.d){if(tick-lastMove>8){if(keys.ArrowUp||keys.w)move(0,-1);else if(keys.ArrowDown||keys.s)move(0,1);else if(keys.ArrowLeft||keys.a)move(-1,0);else move(1,0);lastMove=tick}}}draw();setTimeout(()=>requestAnimationFrame(loop),30)}function draw(){x.fillStyle='#101b35';x.fillRect(0,0,520,520);x.fillStyle='#78c850';x.fillRect(0,0,520,40);x.fillRect(0,440,520,80);for(let i=0;i<5;i++){x.fillStyle=homes.includes(i*3)?'#ffe66d':'#20395a';x.fillRect(i*3*40+4,4,32,32);x.fillStyle='#dce8ff';x.fillRect(i*3*40+13,13,14,14)}for(let y=1;y<=4;y++){x.fillStyle='#225d9c';x.fillRect(0,y*40,520,40);rows[y].objs.forEach(o=>{x.fillStyle='#b97943';x.fillRect(o.x*40,y*40+8,o.len*40-4,24);x.fillStyle='#e8b66a';x.fillRect(o.x*40+5,y*40+12,Math.max(4,o.len*40-18),5)})}x.fillStyle='#3c445b';x.fillRect(0,240,520,200);for(let y=6;y<=10;y++){rows[y].objs.forEach(o=>{x.fillStyle='#e84a5f';x.fillRect(o.x*40,y*40+8,o.len*40-5,24);x.fillStyle='#ffe66d';x.fillRect(o.x*40+5,y*40+12,8,5);x.fillRect(o.x*40+o.len*40-17,y*40+12,8,5)})}x.fillStyle='#78c850';x.fillRect(0,200,520,40);x.fillStyle='#fff0c2';x.fillRect(0,480,520,40);x.fillStyle='#ffe66d';x.fillRect(frog.x*40+8,frog.y*40+7,24,26);x.fillStyle='#101b35';x.fillRect(frog.x*40+13,frog.y*40+13,4,4);x.fillRect(frog.x*40+23,frog.y*40+13,4,4);hud.textContent='SCORE '+score+' · LIVES '+lives+' · HOMES '+homes.length+'/5'+(over?' · GAME OVER':'')}function key(e,down){keys[e.key]=down;if(down&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)){e.preventDefault();if(e.key==='ArrowUp'||e.key==='w')move(0,-1);if(e.key==='ArrowDown'||e.key==='s')move(0,1);if(e.key==='ArrowLeft'||e.key==='a')move(-1,0);if(e.key==='ArrowRight'||e.key==='d')move(1,0)}}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const [dx,dy]=b.dataset.move.split(',').map(Number);move(dx,dy)});document.querySelector('#restart').onclick=setup;setup();</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{})</script><script>(()=>{try{const id=document.body.dataset.game;let a=JSON.parse(localStorage.getItem('retro-played')||'[]');if(!Array.isArray(a))a=[];if(!a.includes(id))a.push(id);localStorage.setItem('retro-played',JSON.stringify(a));let r=JSON.parse(localStorage.getItem('retro-recent')||'[]');if(!Array.isArray(r))r=[];localStorage.setItem('retro-recent',JSON.stringify([id,...r.filter(x=>x!==id)].slice(0,8)));const d=new Date().toISOString().slice(0,10),list=['tetris','snake','2048','tic-tac-toe','racer','space-shooter','breakout','memory-match','platformer','maze-runner','pong','minesweeper','simon','asteroids','frogger','bomber-maze'];if(id===list[Number(d.replace(/-/g,''))%list.length])localStorage.setItem('retro-daily-complete',JSON.stringify(d))}catch(e){}})()</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b35"><title>Bomber Maze — Retro Universe</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../style.css"><style>.board{display:block;width:100%;max-width:520px;aspect-ratio:1;background:#101b35;border:4px solid var(--line);image-rendering:pixelated;touch-action:manipulation}.pad{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:6px;margin:12px}.pad button{min-height:48px;touch-action:manipulation}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.pad button:nth-child(5){grid-column:2;grid-row:3}</style><link rel="manifest" href="../manifest.webmanifest"></head><body data-game="bomber-maze"><header><a class="brand" href="../index.html" aria-label="Retro Universe home"><img class="brand-logo" src="../assets/retro-universe-logo.svg" alt="Retro Universe"></a><span>MAZE ARCADE</span><a href="../index.html">← ARCADE</a></header><main style="max-width:640px;margin:auto;padding:18px"><p class="eyebrow">/// CLEAR THE BLOCKS</p><h1>BOMBER <em>MAZE</em></h1><p>Move with arrows or WASD. Press Space or BOMB to plant a bomb, then escape its blast. Clear the maze and avoid your own explosions.</p><h3 id="hud">BLOCKS 0 · LIVES 3</h3><canvas id="board" class="board" width="520" height="520" aria-label="Bomber Maze game"></canvas><div class="pad"><button data-move="0,-1">▲</button><button data-move="-1,0">◀</button><button id="bomb">💣</button><button data-move="1,0">▶</button><button data-move="0,1">▼</button></div><button id="restart">↻ NEW MAZE</button></main><footer>RETRO UNIVERSE · <a href="../index.html">ARCADE HOME ↑</a></footer><script>
const c=document.querySelector('#board'),ctx=c.getContext('2d'),hud=document.querySelector('#hud'),N=13,T=40;let map,player,bombs,flames,lives,cleared,over,keys={},tick=0,moveTick=0;function setup(){map=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>x===0||y===0||x===N-1||y===N-1||x%2===0&&y%2===0?1:Math.random()<.38?2:0));map[1][1]=map[1][2]=map[2][1]=0;player={x:1,y:1};bombs=[];flames=[];lives=3;cleared=0;over=false;tick=0;moveTick=0;draw()}function move(dx,dy){if(over)return;const nx=player.x+dx,ny=player.y+dy;if(nx<0||ny<0||nx>=N||ny>=N||map[ny][nx]!==0||bombs.some(b=>b.x===nx&&b.y===ny))return;player.x=nx;player.y=ny;checkEnd()}function plant(){if(over||bombs.some(b=>b.x===player.x&&b.y===player.y))return;bombs.push({x:player.x,y:player.y,t:95});}function explode(b){const cells=[[b.x,b.y]];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])for(let i=1;i<=2;i++){let x=b.x+dx*i,y=b.y+dy*i;if(map[y]?.[x]===1)break;cells.push([x,y]);if(map[y][x]===2){map[y][x]=0;cleared++;break}}flames.push({cells,t:24});if(cells.some(([x,y])=>x===player.x&&y===player.y)){lives--;player={x:1,y:1};if(lives<=0)over=true}}function checkEnd(){if(!map.some(row=>row.includes(2))&&!bombs.length){over=true;hud.textContent='MAZE CLEARED! BLOCKS '+cleared+' · PRESS NEW MAZE'}}function loop(){tick++;bombs.forEach(b=>b.t--);const boom=bombs.filter(b=>b.t<=0);bombs=bombs.filter(b=>b.t>0);boom.forEach(explode);flames.forEach(f=>f.t--);flames=flames.filter(f=>f.t>0);if(!over&&tick-moveTick>7){let dx=0,dy=0;if(keys.ArrowUp||keys.w)dy=-1;else if(keys.ArrowDown||keys.s)dy=1;else if(keys.ArrowLeft||keys.a)dx=-1;else if(keys.ArrowRight||keys.d)dx=1;if(dx||dy){move(dx,dy);moveTick=tick}}if(!over)checkEnd();draw();setTimeout(loop,30)}function draw(){ctx.fillStyle='#101b35';ctx.fillRect(0,0,520,520);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=map[y][x],px=x*T,py=y*T;ctx.fillStyle=v===1?'#30496d':v===2?'#a65d3b':'#182b49';ctx.fillRect(px+1,py+1,T-2,T-2);if(v===2){ctx.fillStyle='#d98b52';ctx.fillRect(px+7,py+7,26,26);ctx.fillStyle='#8e4a34';ctx.fillRect(px+12,py+12,16,4)}}bombs.forEach(b=>{ctx.fillStyle='#202735';ctx.beginPath();ctx.arc(b.x*T+20,b.y*T+22,12,0,7);ctx.fill();ctx.fillStyle='#ffe66d';ctx.fillRect(b.x*T+25,b.y*T+6,8,5)});flames.forEach(f=>f.cells.forEach(([x,y])=>{ctx.fillStyle=f.t%2?'#ff7043':'#ffe66d';ctx.fillRect(x*T+4,y*T+4,T-8,T-8)}));ctx.fillStyle='#78c850';ctx.fillRect(player.x*T+7,player.y*T+7,26,26);ctx.fillStyle='#101b35';ctx.fillRect(player.x*T+12,player.y*T+13,4,4);ctx.fillRect(player.x*T+24,player.y*T+13,4,4);hud.textContent='BLOCKS '+cleared+' · LIVES '+lives+(over?' · '+(lives?'MAZE CLEARED':'GAME OVER'):'')}addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '||e.key.toLowerCase()==='b')plant()});addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-move]').forEach(b=>{const [dx,dy]=b.dataset.move.split(',').map(Number);b.onclick=()=>move(dx,dy)});document.querySelector('#bomb').onclick=plant;document.querySelector('#restart').onclick=setup;setup();loop();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{})</script><script>(()=>{try{const id=document.body.dataset.game;let a=JSON.parse(localStorage.getItem('retro-played')||'[]');if(!Array.isArray(a))a=[];if(!a.includes(id))a.push(id);localStorage.setItem('retro-played',JSON.stringify(a));let r=JSON.parse(localStorage.getItem('retro-recent')||'[]');if(!Array.isArray(r))r=[];localStorage.setItem('retro-recent',JSON.stringify([id,...r.filter(x=>x!==id)].slice(0,8)));const d=new Date().toISOString().slice(0,10),list=['tetris','snake','2048','tic-tac-toe','racer','space-shooter','breakout','memory-match','platformer','maze-runner','pong','minesweeper','simon','asteroids','frogger','bomber-maze'];if(id===list[Number(d.replace(/-/g,''))%list.length])localStorage.setItem('retro-daily-complete',JSON.stringify(d))}catch(e){}})()</script><script src="../js/game-enhancements.js"></script><script src="../js/arcade-system.js"></script><script src="../js/universal-controls.js"></script></body></html>

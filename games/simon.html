<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simon Says — Retro Universe</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../style.css"><style>.simon{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(90vw,400px);margin:18px auto}.pad{aspect-ratio:1;border:5px solid #fff0c2;opacity:.82;touch-action:manipulation}.pad:active,.pad.lit{opacity:1;filter:brightness(1.6);transform:scale(.98)}.p0{background:#e84a5f}.p1{background:#78c850}.p2{background:#f8d848}.p3{background:#62d6e8}</style><link rel="manifest" href="../manifest.webmanifest"></head><body data-game="simon"><header><a class="brand" href="../index.html"><b>RU</b> RETRO UNIVERSE</a><span>MEMORY TEST</span><a href="../index.html">← ARCADE</a></header><main style="max-width:650px;margin:auto;padding:18px;text-align:center"><p class="eyebrow">/// REMEMBER THE SEQUENCE</p><h1>SIMON <em>SAYS</em></h1><p>Watch the lights, then repeat the sequence in the same order.</p><h3 id="status">LEVEL 0</h3><div class="simon" id="board"></div><button id="start">▶ START GAME</button></main><footer>RETRO UNIVERSE · <a href="../index.html">ARCADE HOME ↑</a></footer><script>const board=document.querySelector('#board'),statusEl=document.querySelector('#status');let seq=[],input=[],locked=true;const colors=['red','green','yellow','blue'];colors.forEach((_,i)=>{let b=document.createElement('button');b.className='pad p'+i;b.setAttribute('aria-label','Color '+(i+1));b.onclick=()=>pick(i);board.append(b)});const pads=[...board.children];function flash(i){pads[i].classList.add('lit');setTimeout(()=>pads[i].classList.remove('lit'),260)}function show(i=0){if(i>=seq.length){locked=false;input=[];statusEl.textContent='LEVEL '+seq.length+' — YOUR TURN';return}locked=true;setTimeout(()=>{flash(seq[i]);setTimeout(()=>show(i+1),380)},420)}function next(){seq.push(Math.floor(Math.random()*4));statusEl.textContent='LEVEL '+seq.length+' — WATCH';show()}function pick(i){if(locked)return;flash(i);if(seq[input.length]!==i){locked=true;statusEl.textContent='GAME OVER — SCORE '+Math.max(0,seq.length-1);return}input.push(i);if(input.length===seq.length)setTimeout(next,550)}document.querySelector('#start').onclick=()=>{seq=[];input=[];locked=true;next()}</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{})</script><script>(()=>{const id=document.body.dataset.game;try{let played=JSON.parse(localStorage.getItem('retro-played')||'[]');if(!Array.isArray(played))played=[];if(!played.includes(id))played.push(id);localStorage.setItem('retro-played',JSON.stringify(played));let recent=JSON.parse(localStorage.getItem('retro-recent')||'[]');if(!Array.isArray(recent))recent=[];localStorage.setItem('retro-recent',JSON.stringify([id,...recent.filter(x=>x!==id)].slice(0,8)));const d=new Date().toISOString().slice(0,10),list=['tetris','snake','2048','tic-tac-toe','racer','space-shooter','breakout','memory-match','platformer','maze-runner','pong','minesweeper','simon'];if(id===list[Number(d.replace(/-/g,''))%list.length])localStorage.setItem('retro-daily-complete',JSON.stringify(d))}catch(e){}})()</script><script src="../js/game-enhancements.js"></script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b35"><title>Memory Match · Retro Universe</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../style.css"></head><body><header><a href="../index.html"><b>RU</b> RETRO UNIVERSE</a><span>8-BIT ARCADE</span><a href="../index.html">← ARCADE</a></header><main class="game-shell"><a class="back" href="../index.html">← GAME SELECT</a><h1>MEMORY <em>MATCH</em></h1><p class="muted">Flip cards and find all eight pixel pairs in as few moves as possible.</p><section class="panel"><div class="hud"><span>MOVES <b id="moves">0</b></span><span id="status">FIND THE PAIRS</span><span>PAIRS <b id="pairs">0/8</b></span></div><div id="board" class="memory-board" aria-label="Memory match cards"></div><div class="controls"><button id="new">↻ NEW GAME</button></div><p class="note">Tap or click cards to reveal them. Matches stay open.</p></section></main><footer>RETRO UNIVERSE · PLAYER 1 <a href="../index.html">BACK TO ARCADE ↑</a></footer>
<style>.memory-board{display:grid;grid-template-columns:repeat(4,minmax(0,76px));justify-content:center;gap:8px;margin:20px auto}.memory-card{aspect-ratio:1;padding:0;display:grid;place-items:center;font-size:clamp(22px,7vw,38px);background:#243b67;color:#fff0c2;border:3px solid #fff0c2;box-shadow:3px 3px 0 #080e1c;touch-action:manipulation}.memory-card.open,.memory-card.matched{background:#f4c84a;color:#101b35}.memory-card.matched{border-color:#42b6a5}@media(max-width:360px){.memory-board{gap:5px;grid-template-columns:repeat(4,minmax(0,1fr))}}</style>
<script>(()=>{const icons=['★','♥','♣','♦','☀','☾','♫','◆'],board=document.querySelector('#board');let deck=[],opened=[],moves=0,pairs=0,lock=false;function start(){deck=[...icons,...icons].sort(()=>Math.random()-.5);opened=[];moves=0;pairs=0;lock=false;document.querySelector('#moves').textContent=0;document.querySelector('#pairs').textContent='0/8';document.querySelector('#status').textContent='FIND THE PAIRS';board.innerHTML='';deck.forEach((v,i)=>{const b=document.createElement('button');b.className='memory-card';b.textContent='?';b.setAttribute('aria-label','Hidden card '+(i+1));b.onclick=()=>flip(i,b);board.append(b)})}function flip(i,b){if(lock||b.classList.contains('open')||b.classList.contains('matched'))return;b.textContent=deck[i];b.classList.add('open');b.setAttribute('aria-label','Card '+deck[i]);opened.push({i,b});if(opened.length===2){moves++;document.querySelector('#moves').textContent=moves;if(deck[opened[0].i]===deck[opened[1].i]){opened.forEach(v=>v.b.classList.add('matched'));opened=[];pairs++;document.querySelector('#pairs').textContent=pairs+'/8';if(pairs===8)document.querySelector('#status').textContent='YOU WIN! MOVES: '+moves}else{lock=true;const pair=opened;setTimeout(()=>{pair.forEach(v=>{v.b.classList.remove('open');v.b.textContent='?';v.b.setAttribute('aria-label','Hidden card')});opened=[];lock=false},650)}}}document.querySelector('#new').onclick=start;start()})();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Mines — Retro Universe</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../style.css"><style>.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;width:min(94vw,420px);margin:18px auto}.tile{aspect-ratio:1;min-width:0;padding:0;border:2px solid #60779a;background:#223960;color:#fff0c2;font-size:clamp(12px,3vw,20px);font-weight:bold}.tile.open{background:#101b35;border-color:#30496d}.tile.flag{color:#f8d848}.game-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}</style></head><body data-game="minesweeper"><header><a class="brand" href="../index.html"><b>RU</b> RETRO UNIVERSE</a><span>PUZZLE MODE</span><a href="../index.html">← ARCADE</a></header><main style="max-width:700px;margin:auto;padding:18px;text-align:center"><p class="eyebrow">/// CLEAR THE FIELD</p><h1>PIXEL <em>MINES</em></h1><p>Tap to reveal. Use FLAG MODE to mark suspected mines. Find every safe tile.</p><h3 id="status">SAFE TILES: 71</h3><div class="game-actions"><button id="flag">⚑ FLAG MODE: OFF</button><button id="reset">↻ NEW FIELD</button></div><div id="board" class="board"></div></main><footer>RETRO UNIVERSE · <a href="../index.html">ARCADE HOME ↑</a></footer><script>const N=9,M=10,board=document.querySelector('#board'),statusEl=document.querySelector('#status'),flagBtn=document.querySelector('#flag');let mines,opened,flags,flagMode,over;function start(){mines=new Set();while(mines.size<M)mines.add(Math.floor(Math.random()*N*N));opened=new Set();flags=new Set();flagMode=false;over=false;flagBtn.textContent='⚑ FLAG MODE: OFF';draw()}function neighbors(i){let x=i%N,y=Math.floor(i/N),a=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let xx=x+dx,yy=y+dy;if((dx||dy)&&xx>=0&&xx<N&&yy>=0&&yy<N)a.push(yy*N+xx)}return a}function reveal(i){if(over||opened.has(i))return;if(flagMode){if(flags.has(i))flags.delete(i);else flags.add(i);draw();return}if(flags.has(i))return;opened.add(i);if(mines.has(i)){over=true;draw();statusEl.textContent='BOOM! FIELD LOST — START A NEW FIELD';return}if(neighbors(i).filter(n=>mines.has(n)).length===0)neighbors(i).forEach(n=>{if(!opened.has(n))reveal(n)});if(opened.size===N*N-M){over=true;statusEl.textContent='FIELD CLEARED! YOU WIN!'}draw()}function draw(){board.innerHTML='';for(let i=0;i<N*N;i++){let b=document.createElement('button');b.className='tile'+(opened.has(i)?' open':'')+(flags.has(i)?' flag':'');b.textContent=flags.has(i)?'⚑':opened.has(i)?(mines.has(i)?'✹':neighbors(i).filter(n=>mines.has(n)).length||''):(over&&mines.has(i)?'✹':'');if(opened.has(i)&&!mines.has(i)){let n=neighbors(i).filter(a=>mines.has(a)).length;if(n)b.style.color=['','#62d6e8','#78c850','#f8d848','#e84a5f','#b79ced'][Math.min(n,5)]}b.onclick=()=>reveal(i);board.append(b)}if(!over)statusEl.textContent='SAFE TILES: '+(N*N-M-opened.size)+' · FLAGS: '+flags.size}flagBtn.onclick=()=>{flagMode=!flagMode;flagBtn.textContent='⚑ FLAG MODE: '+(flagMode?'ON':'OFF')};document.querySelector('#reset').onclick=start;start()</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{})</script><script>(()=>{const id=document.body.dataset.game;try{let played=JSON.parse(localStorage.getItem('retro-played')||'[]');if(!Array.isArray(played))played=[];if(!played.includes(id))played.push(id);localStorage.setItem('retro-played',JSON.stringify(played));let recent=JSON.parse(localStorage.getItem('retro-recent')||'[]');if(!Array.isArray(recent))recent=[];localStorage.setItem('retro-recent',JSON.stringify([id,...recent.filter(x=>x!==id)].slice(0,8)));const d=new Date().toISOString().slice(0,10),list=['tetris','snake','2048','tic-tac-toe','racer','space-shooter','breakout','memory-match','platformer','maze-runner','pong','minesweeper','simon'];if(id===list[Number(d.replace(/-/g,''))%list.length])localStorage.setItem('retro-daily-complete',JSON.stringify(d))}catch(e){}})()</script></body></html>

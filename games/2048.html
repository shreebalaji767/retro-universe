<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 · Retro Universe</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../style.css"><style>.board2048{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;max-width:440px;margin:auto;padding:8px;background:#37324e;touch-action:none}.tile{display:grid;place-items:center;aspect-ratio:1;background:#24213a;border:2px solid #4c4567;font-size:clamp(18px,5vw,30px);font-weight:bold}.v2{background:#f1dfbd;color:#453a36}.v4{background:#f6cb8e;color:#453a36}.v8{background:#ffad62;color:#271b29}.v16{background:#ff8c68}.v32{background:#ff6b8b}.v64{background:#ee518d}.v128,.v256,.v512{background:#a98bff}.v1024,.v2048{background:#5de7dc;color:#17152b}</style></head><body data-game="2048"><header><a class="brand" href="../index.html" aria-label="Retro Universe home"><img class="brand-logo" src="../assets/retro-universe-logo.svg" alt="Retro Universe"></a><span>8-BIT ARCADE · PLAYER 1</span><a href="../index.html">← ARCADE</a></header><main class="game-shell"><a class="back" href="../index.html">← GAME SELECT</a><h1>2048 <em>PIXEL</em></h1><div class="panel"><div class="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div><div class="controls"><label for="board-size" class="note">BOARD</label><select id="board-size" aria-label="Board size"><option value="3">3 × 3 · QUICK</option><option value="4" selected>4 × 4 · CLASSIC</option><option value="5">5 × 5 · BIG</option></select><label for="target-tile" class="note">TARGET</label><select id="target-tile" aria-label="Target tile"><option value="512">512 · QUICK</option><option value="2048" selected>2048 · CLASSIC</option><option value="4096">4096 · EXPERT</option></select></div><p class="note">Merge matching numbers. Reach 2048, then keep going to beat your high score!</p><div id="board" class="board2048"></div><p id="status" class="note">Arrow keys, WASD, or swipe to move.</p><div class="controls"><button id="new">↻ NEW GAME</button><button id="undo">↶ UNDO</button></div><div class="touch" aria-label="Move tiles"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div></div></main><script>const el=document.querySelector('#board'),sizePicker=document.querySelector('#board-size'),targetPicker=document.querySelector('#target-tile');let g,size=4,target=2048,score=0,best=0,history=[],ended=false,won=false,winShown=false;
function bestKey(){return '2048-best-'+size}
function empty(){const spots=[];g.forEach((r,y)=>r.forEach((v,x)=>{if(!v)spots.push([y,x])}));return spots}
function spawn(){const spots=empty();if(!spots.length)return;const [y,x]=spots[Math.random()*spots.length|0];g[y][x]=Math.random()<.9?2:4}
function draw(){el.style.gridTemplateColumns='repeat('+size+',minmax(0,1fr))';el.style.maxWidth=(size===3?360:size===4?440:500)+'px';el.innerHTML='';g.flat().forEach(v=>{const d=document.createElement('div');d.className='tile '+(v?'v'+v:'');d.textContent=v||'';d.style.fontSize='clamp('+(size===5?13:16)+'px, '+(size===5?3.7:5)+'vw, '+(size===5?23:30)+'px)';el.append(d)});document.querySelector('#score').textContent=score;document.querySelector('#best').textContent=best;document.querySelector('#undo').disabled=!history.length;document.querySelector('#status').textContent=ended?'NO MOVES LEFT — NEW GAME':won?target+' REACHED! KEEP PLAYING':'Board '+size+'×'+size+' · Target '+target+' · Arrow keys, WASD, swipe or Backspace to undo.'}
function fresh(){size=Number(sizePicker.value);target=Number(targetPicker.value);best=Number(localStorage.getItem(bestKey())||(size===4?localStorage.getItem('2048-best'):0)||0);g=Array.from({length:size},()=>Array(size).fill(0));score=0;history=[];ended=false;won=false;winShown=false;spawn();spawn();draw()}
function slide(line){const packed=line.filter(Boolean),out=[];let points=0;for(let i=0;i<packed.length;i++){if(packed[i]===packed[i+1]){out.push(packed[i]*2);points+=packed[i]*2;i++}else out.push(packed[i])}while(out.length<size)out.push(0);return{out,gain:points}}
function canMove(){for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!g[y][x]||(x<size-1&&g[y][x]===g[y][x+1])||(y<size-1&&g[y][x]===g[y+1][x]))return true;return false}
function move(direction){if(ended)return;const next=Array.from({length:size},()=>Array(size).fill(0));let gain=0;for(let i=0;i<size;i++){const line=Array.from({length:size},(_,j)=>direction==='left'?g[i][j]:direction==='right'?g[i][size-1-j]:direction==='up'?g[j][i]:g[size-1-j][i]),result=slide(line);gain+=result.gain;for(let j=0;j<size;j++){if(direction==='left')next[i][j]=result.out[j];else if(direction==='right')next[i][size-1-j]=result.out[j];else if(direction==='up')next[j][i]=result.out[j];else next[size-1-j][i]=result.out[j]}}if(next.every((row,y)=>row.every((v,x)=>v===g[y][x])))return;history.push({g:g.map(row=>row.slice()),score,won});if(history.length>20)history.shift();g=next;score+=gain;if(score>best){best=score;localStorage.setItem(bestKey(),String(best));if(size===4)localStorage.setItem('2048-best',String(best))}if(!won&&g.some(row=>row.includes(target))){won=true;winShown=true}spawn();ended=!empty().length&&!canMove();draw()}
document.onkeydown=e=>{if(e.key==='Backspace'){e.preventDefault();document.querySelector('#undo').click();return}const direction={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'}[e.key];if(direction){e.preventDefault();move(direction)}};
document.querySelectorAll('[data-dir]').forEach(button=>button.onclick=()=>move(button.dataset.dir));document.querySelector('#new').onclick=fresh;document.querySelector('#undo').onclick=()=>{const previous=history.pop();if(previous){g=previous.g;score=previous.score;won=previous.won;winShown=false;ended=false;draw()}};sizePicker.onchange=fresh;targetPicker.onchange=fresh;
let touch=null;el.onpointerdown=e=>{touch={x:e.clientX,y:e.clientY};el.setPointerCapture?.(e.pointerId)};el.onpointerup=e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))>18)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')};fresh();</script><footer>RETRO UNIVERSE · PLAYER 1 <a href="../index.html">BACK TO ARCADE ↑</a></footer><script>(()=>{const id=document.body.dataset.game;if(!id)return;try{const read=k=>JSON.parse(localStorage.getItem(k)||'[]');let played=read('retro-played');if(!Array.isArray(played))played=[];if(!played.includes(id))played.push(id);localStorage.setItem('retro-played',JSON.stringify(played));let recent=read('retro-recent');if(!Array.isArray(recent))recent=[];recent=[id,...recent.filter(x=>x!==id)].slice(0,8);localStorage.setItem('retro-recent',JSON.stringify(recent));const day=new Date().toISOString().slice(0,10),daily=['tetris','snake','2048','tic-tac-toe','racer','space-shooter','breakout','memory-match'][Number(day.replace(/-/g,''))%8];if(id===daily)localStorage.setItem('retro-daily-complete',JSON.stringify(day))}catch(e){}})()</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}))}</script><script src="../js/game-enhancements.js"></script><script src="../js/arcade-system.js"></script><script src="../js/universal-controls.js"></script></body></html>

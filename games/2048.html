best=+(localStorage.getItem('2048-best')||0),history=[],ended=false,won=false;function empty(){let a=[];g.forEach((r,y)=>r.forEach((v,x)=>{if(!v)a.push([y,x])}));return a}function spawn(){let a=empty();if(!a.length)return;let [y,x]=a[Math.random()*a.length|0];g[y][x]=Math.random()<.9?2:4}function draw(){el.innerHTML='';g.flat().forEach(v=>{let d=document.createElement('div');d.className='tile '+(v?'v'+v:'');d.textContent=v||'';el.append(d)});document.querySelector('#score').textContent=score;document.querySelector('#best').textContent=best;document.querySelector('#undo').disabled=history.length===0;document.querySelector('#status').textContent=ended?'NO MOVES LEFT — NEW GAME':won?'2048 REACHED! KEEP PLAYING — OR START A NEW GAME':'Arrow keys, WASD, or swipe to move.'}function fresh(){g=Array.from({length:4},()=>Array(4).fill(0));score=0;history=[];ended=false;won=false;spawn();spawn();draw()}function slide(a){a=a.filter(Boolean);let out=[],gain=0;for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){out.push(a[i]*2);gain+=a[i]*2;i++}else out.push(a[i])}while(out.length<4)out.push(0);return {out,gain}}function can(){for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(!g[y][x]||(x<3&&g[y][x]===g[y][x+1])||(y<3&&g[y][x]===g[y+1][x]))return true;return false}function move(d){if(ended)return;let old=g.map(r=>r.slice()),next=Array.from({length:4},()=>Array(4).fill(0)),gain=0;for(let i=0;i<4;i++){let a=Array.from({length:4},(_,j)=>d==='left'?g[i][j]:d==='right'?g[i][3-j]:d==='up'?g[j][i]:g[3-j][i]),r=slide(a);gain+=r.gain;for(let j=0;j<4;j++){if(d==='left')next[i][j]=r.out[j];if(d==='right')next[i][3-j]=r.out[j];if(d==='up')next[j][i]=r.out[j];if(d==='down')next[3-j][i]=r.out[j]}}if(next.every((r,y)=>r.every((v,x)=>v===g[y][x])))return;history.push({g:old,score,won});if(history.length>20)history.shift();g=next;score+=gain;if(score>best){best=score;localStorage.setItem('2048-best',best)}if(!won&&g.some(r=>r.includes(2048))){won=true;}spawn();ended=!empty().length&&!can();draw()}document.onk

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b35"><title>Star Blaster · Retro Universe</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../style.css"><link rel="manifest" href="../manifest.webmanifest"></head><body data-game="space-shooter"><header><a class="brand" href="../index.html" aria-label="Retro Universe home"><img class="brand-logo" src="../assets/retro-universe-logo.svg" alt="Retro Universe"></a><span>8-BIT ARCADE</span><a href="../index.html">← ARCADE</a></header><main class="game-shell"><a class="back" href="../index.html">← GAME SELECT</a><h1>STAR <em>BLASTER</em></h1><p class="muted">Blast the incoming invaders. Keyboard and touch controls supported.</p><section class="panel"><div class="hud"><span>SCORE <b id="score">0</b></span><span id="status">PRESS START</span><span>LIVES <b id="lives">3</b></span></div><canvas id="game" width="360" height="480" aria-label="Space shooter game"></canvas><div class="controls"><button id="start">▶ START / RESTART</button><button id="pause">Ⅱ PAUSE</button></div><div class="touch"><button class="left" data-a="left">◀</button><button data-a="fire">✦ FIRE</button><button class="right" data-a="right">▶</button></div><p class="note">Move: ← → / A D · Fire: Space · Touch buttons on phones.</p></section></main><footer>RETRO UNIVERSE · PLAYER 1 <a href="../index.html">BACK TO ARCADE ↑</a></footer>
<script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d');let ship=180,shots=[],foes=[],score=0,lives=3,level=1,running=false,paused=false,raf,last=0,spawn=0,keys={};function reset(){cancelAnimationFrame(raf);ship=180;shots=[];foes=[];score=0;lives=3;level=1;running=true;paused=false;last=0;spawn=0;document.querySelector('#score').textContent=0;document.querySelector('#lives').textContent=3;document.querySelector('#status').textContent='LEVEL 1 · FIGHT!';document.querySelector('#pause').textContent='Ⅱ PAUSE';raf=requestAnimationFrame(loop)}function fire(){if(running&&!paused&&shots.length<8)shots.push({x:ship,y:405})}function draw(){ctx.fillStyle='#101b35';ctx.fillRect(0,0,360,480);for(let i=0;i<50;i++){let x=(i*71)%360,y=(i*97+score*2)%480;ctx.fillStyle=i%3?'#fff0c2':'#e84a5f';ctx.fillRect(x,y,2,2)}shots.forEach(s=>{ctx.fillStyle='#f4c84a';ctx.fillRect(s.x-2,s.y,4,12)});foes.forEach(f=>{ctx.fillStyle='#e84a5f';ctx.fillRect(f.x-12,f.y-9,24,18);ctx.fillStyle='#fff0c2';ctx.fillRect(f.x-7,f.y-4,4,4);ctx.fillRect(f.x+3,f.y-4,4,4);ctx.fillStyle='#f4c84a';ctx.fillRect(f.x-17,f.y+5,34,4)});ctx.fillStyle='#42b6a5';ctx.fillRect(ship-14,414,28,28);ctx.fillStyle='#fff0c2';ctx.fillRect(ship-5,400,10,17);ctx.fillStyle='#e84a5f';ctx.fillRect(ship-22,431,9,8);ctx.fillRect(ship+13,431,9,8);if(!running||paused){ctx.fillStyle='#101b35dd';ctx.fillRect(40,195,280,80);ctx.fillStyle='#fff0c2';ctx.textAlign='center';ctx.font='bold 20px monospace';ctx.fillText(paused?'PAUSED':score?'GAME OVER':'READY PLAYER ONE',180,230);ctx.font='12px monospace';ctx.fillText(paused?'TAP RESUME':'PRESS START',180,252)}}function loop(t){if(!running)return;if(!paused){let dt=Math.min(32,t-(last||t));last=t;if(keys.left)ship=Math.max(18,ship-dt*.23);if(keys.right)ship=Math.min(342,ship+dt*.23);spawn+=dt;if(spawn>Math.max(260,650-score/2)){foes.push({x:20+Math.random()*320,y:-10,s:.07+Math.random()*.07});spawn=0}shots.forEach(s=>s.y-=dt*.48);foes.forEach(f=>f.y+=dt*f.s);shots=shots.filter(s=>s.y>-15);for(let i=foes.length-1;i>=0;i--){let f=foes[i],hit=shots.findIndex(s=>Math.abs(s.x-f.x)<19&&Math.abs(s.y-f.y)<18);if(hit>=0){shots.splice(hit,1);foes.splice(i,1);score+=10;const nextLevel=1+Math.floor(score/100);if(nextLevel!==level){level=nextLevel;document.querySelector('#status').textContent='LEVEL '+level+' · INCOMING!'}document.querySelector('#score').textContent=score}else if(f.y>415){foes.splice(i,1);lives--;document.querySelector('#lives').textContent=lives;if(lives<=0){running=false;document.querySelector('#status').textContent='GAME OVER'}}}}draw();if(running)raf=requestAnimationFrame(loop)}document.querySelector('#start').onclick=reset;document.querySelector('#pause').onclick=()=>{if(!running)return;paused=!paused;document.querySelector('#status').textContent=paused?'PAUSED':'FIGHT!';document.querySelector('#pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';if(paused)cancelAnimationFrame(raf);else{last=0;raf=requestAnimationFrame(loop)}draw()};document.querySelectorAll('[data-a]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();if(b.dataset.a==='fire')fire();else keys[b.dataset.a]=true};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(b.dataset.a!=='fire')keys[b.dataset.a]=false}))});document.onkeydown=e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright',' ','a','d'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' ')fire()};document.onkeyup=e=>{let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false};draw()})();
</script><script>(()=>{const id=document.body.dataset.game;if(!id)return;try{const read=k=>JSON.parse(localStorage.getItem(k)||'[]');let played=read('retro-played');if(!Array.isArray(played))played=[];if(!played.includes(id))played.push(id);localStorage.setItem('retro-played',JSON.stringify(played));let recent=read('retro-recent');if(!Array.isArray(recent))recent=[];recent=[id,...recent.filter(x=>x!==id)].slice(0,8);localStorage.setItem('retro-recent',JSON.stringify(recent));const day=new Date().toISOString().slice(0,10),daily=['tetris','snake','2048','tic-tac-toe','racer','space-shooter','breakout','memory-match'][Number(day.replace(/-/g,''))%8];if(id===daily)localStorage.setItem('retro-daily-complete',JSON.stringify(day))}catch(e){}})()</script><script src="../js/game-enhancements.js"></script><script src="../js/arcade-system.js"></script></body></html>

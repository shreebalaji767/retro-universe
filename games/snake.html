<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake · Retro Universe</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../style.css"></head><body data-game="snake"><header><a href="../index.html" aria-label="Retro Universe home"><b>RU</b> RETRO UNIVERSE</a><span>8-BIT ARCADE · PLAYER 1</span><a href="../index.html">← ARCADE</a></header><main class="game-shell"><a class="back" href="../index.html">← GAME SELECT</a><h1>SNAKE <em>198X</em></h1><div class="panel"><div class="hud"><span>SCORE <b id="score">0</b></span><span id="state">PRESS START</span><span>BEST <b id="best">0</b></span></div><canvas id="c" width="400" height="400"></canvas><div class="controls"><button id="start">▶ START / RESTART</button></div><div class="touch"><button class="up" data-d="up">▲</button><button class="left" data-d="left">◀</button><button class="down" data-d="down">▼</button><button class="right" data-d="right">▶</button></div><p class="note">Arrow keys / WASD, touch buttons, or swipe on the board.</p></div></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),N=20,S=20;let snake,food,dir,next,score=0,timer=null,run=false,best=+(localStorage.getItem('snake-best')||0);document.querySelector('#best').textContent=best;function spawn(){let p;do{p={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(q=>q.x===p.x&&q.y===p.y));return p}function paint(){x.fillStyle='#101b27';x.fillRect(0,0,400,400);x.strokeStyle='#243346';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,400);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(400,i*S);x.stroke()}x.fillStyle='#ff5e9c';x.fillRect(food.x*S+3,food.y*S+3,14,14);snake.forEach((p,i)=>{x.fillStyle=i?'#5de7dc':'#8cf28b';x.fillRect(p.x*S+1,p.y*S+1,18,18)});if(!run){x.fillStyle='#17152be8';x.fillRect(40,165,320,70);x.fillStyle='#ffe66d';x.font='bold 17px monospace';x.textAlign='center';x.fillText(score?'GAME OVER':'READY PLAYER ONE',200,195);x.fillStyle='#fff';x.font='11px monospace';x.fillText('PRESS START TO PLAY',200,216)}}function end(){run=false;clearInterval(timer);timer=null;document.querySelector('#state').textContent='GAME OVER';paint()}function step(){dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){end();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;document.querySelector('#score').textContent=score;food=spawn();if(score>best){best=score;localStorage.setItem('snake-best',best);document.querySelector('#best').textContent=best}}else snake.pop();paint()}function fresh(){clearInterval(timer);snake=[{x:5,y:10},{x:4,y:10},{x:3,y:10}];dir=next={x:1,y:0};score=0;food=spawn();run=true;document.querySelector('#score').textContent='0';document.querySelector('#state').textContent='PLAYING';timer=setInterval(step,125);paint()}function set(d){let m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];if(m&&!(m.x===-dir.x&&m.y===-dir.y))next=m}document.querySelector('#start').onclick=fresh;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>set(b.dataset.d));document.onkeydown=e=>{let d={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];if(d){e.preventDefault();set(d)}};let touch;c.ontouchstart=e=>touch={x:e.touches[0].clientX,y:e.touches[0].clientY};c.ontouchend=e=>{if(!touch)return;let dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>15)set(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')};snake=[{x:5,y:10},{x:4,y:10},{x:3,y:10}];dir=next={x:1,y:0};food={x:14,y:10};paint();</script><footer>RETRO UNIVERSE · PLAYER 1 <a href="../index.html">BACK TO ARCADE ↑</a></footer><script>(()=>{const id=document.body.dataset.game;if(!id)return;try{const read=k=>JSON.parse(localStorage.getItem(k)||'[]');let played=read('retro-played');if(!Array.isArray(played))played=[];if(!played.includes(id))played.push(id);localStorage.setItem('retro-played',JSON.stringify(played));let recent=read('retro-recent');if(!Array.isArray(recent))recent=[];recent=[id,...recent.filter(x=>x!==id)].slice(0,8);localStorage.setItem('retro-recent',JSON.stringify(recent));const day=new Date().toISOString().slice(0,10),daily=['tetris','snake','2048','tic-tac-toe','racer','space-shooter','breakout','memory-match'][Number(day.replace(/-/g,''))%8];if(id===daily)localStorage.setItem('retro-daily-complete',JSON.stringify(day))}catch(e){}})()</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}))}</script></body></html>

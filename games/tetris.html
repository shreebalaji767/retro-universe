<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tetris DX · Retro Universe</title><link rel="stylesheet" href="../style.css"><style>.play{display:flex;justify-content:center;align-items:flex-start;gap:15px;flex-wrap:wrap}.side{min-width:100px;text-align:left}.side b{display:block;font-size:22px;color:var(--yellow);margin-bottom:16px}.side small{font-size:9px;color:var(--muted)}.tcanvas{width:min(60vw,300px)}</style></head><body><header><a href="../index.html"><b>RU</b> RETRO UNIVERSE</a><a href="../index.html">← ARCADE</a></header><main class="game-shell"><a class="back" href="../index.html">← GAME SELECT</a><h1>TETRIS <em>DX</em></h1><div class="panel"><div class="play"><canvas id="c" class="tcanvas" width="300" height="600"></canvas><aside class="side"><small>SCORE</small><b id="score">0</b><small>LINES</small><b id="lines">0</b><small>LEVEL</small><b id="level">1</b><p class="note" id="status">Press start.</p><button id="start">▶ START / RESTART</button></aside></div><div class="controls"><button data-a="left">◀ LEFT</button><button data-a="rot">↻ ROTATE</button><button data-a="right">RIGHT ▶</button><button data-a="down">▼ DROP</button><button data-a="hard">⬇ HARD DROP</button></div><div class="touch"><button class="up" data-a="rot">↻</button><button class="left" data-a="left">◀</button><button class="down" data-a="down">▼</button><button class="right" data-a="right">▶</button></div><p class="note">Keyboard: arrows move, ↑ rotate, Space hard drop. Touch buttons supported.</p></div></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),W=10,H=20,B=30,C=['','#5de7dc','#a98bff','#ffad62','#ffe66d','#ff5e9c','#8cf28b','#e98bff'],shapes=[[[1,1,1,1]],[[2,0,0],[2,2,2]],[[0,0,3],[3,3,3]],[[4,4],[4,4]],[[0,5,5],[5,5,0]],[[0,6,0],[6,6,6]],[[7,7,0],[0,7,7]]];let g,p,score=0,lines=0,level=1,run=false,over=false,last=0,drop=0,raf;function np(){let s=shapes[Math.random()*shapes.length|0].map(r=>r.slice());return{s,x:Math.floor((W-s[0].length)/2),y:0}}function hit(dx=0,dy=0,s=p.s){return s.some((r,y)=>r.some((v,z)=>v&&(p.x+z+dx<0||p.x+z+dx>=W||p.y+y+dy>=H||(p.y+y+dy>=0&&g[p.y+y+dy][p.x+z+dx]))))}function draw(){x.fillStyle='#101522';x.fillRect(0,0,300,600);x.strokeStyle='#20283c';for(let i=0;i<=W;i++){x.beginPath();x.moveTo(i*B,0);x.lineTo(i*B,600);x.stroke()}for(let i=0;i<=H;i++){x.beginPath();x.moveTo(0,i*B);x.lineTo(300,i*B);x.stroke()}g.forEach((r,y)=>r.forEach((v,z)=>block(v,z,y)));p.s.forEach((r,y)=>r.forEach((v,z)=>block(v,p.x+z,p.y+y)));if(over){x.fillStyle='#17152be8';x.fillRect(20,250,260,90);x.fillStyle='#ff5e9c';x.font='bold 22px monospace';x.textAlign='center';x.fillText('GAME OVER',150,290);x.fillStyle='#fff';x.font='12px monospace';x.fillText('PRESS RESTART',150,315)}}function block(v,z,y){if(!v)return;x.fillStyle=C[v];x.fillRect(z*B+1,y*B+1,B-2,B-2);x.fillStyle='#ffffff33';x.fillRect(z*B+2,y*B+2,B-4,3)}function lock(){p.s.forEach((r,y)=>r.forEach((v,z)=>{if(v&&p.y+y>=0)g[p.y+y][p.x+z]=v}));let n=0;g=g.filter(r=>{if(r.every(Boolean)){n++;return false}return true});while(g.length<H)g.unshift(Array(W).fill(0));if(n){lines+=n;score+=[0,100,300,500,800][n]*level;level=1+Math.floor(lines/10)}document.querySelector('#score').textContent=score;document.querySelector('#lines').textContent=lines;document.querySelector('#level').textContent=level;p=np();if(hit()){run=false;over=true;document.querySelector('#status').textContent='GAME OVER'}draw()}function act(a){if(!run)return;if(a==='left'&&!hit(-1))p.x--;if(a==='right'&&!hit(1))p.x++;if(a==='down'){if(!hit(0,1)){p.y++;score++}else lock()}if(a==='hard'){while(!hit(0,1)){p.y++;score+=2}lock()}if(a==='rot'){let s=p.s[0].map((_,i)=>p.s.map(r=>r[i]).reverse());if(!hit(0,0,s))p.s=s;else if(!hit(1,0,s)){p.x++;p.s=s}else if(!hit(-1,0,s)){p.x--;p.s=s}}draw()}function loop(t){if(!run)return;if(t-last>Math.max(100,700-(level-1)*50)){if(!hit(0,1))p.y++;else lock();last=t}draw();raf=requestAnimationFrame(loop)}function fresh(){cancelAnimationFrame(raf);g=Array.from({length:H},()=>Array(W).fill(0));p=np();score=lines=0;level=1;run=true;over=false;last=performance.now();document.querySelector('#status').textContent='PLAYING';document.querySelector('#score').textContent=0;document.querySelector('#lines').textContent=0;document.querySelector('#level').textContent=1;raf=requestAnimationFrame(loop)}document.querySelector('#start').onclick=fresh;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));document.onkeydown=e=>{let a={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'rot',' ':'hard'}[e.key];if(a){e.preventDefault();if(!run&&e.key===' ')fresh();else act(a)}};g=Array.from({length:H},()=>Array(W).fill(0));p=np();draw();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b35"><title>Pixel Pinball · Retro Universe</title><link rel="stylesheet" href="../style.css"><link rel="icon" href="../assets/favicon.svg"><link rel="manifest" href="../manifest.webmanifest"><style>.field{display:block;width:min(94vw,460px);aspect-ratio:3/4;margin:auto;border:4px solid var(--line);background:#101b35;touch-action:none}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px}.controls button{min-width:90px;min-height:48px}</style></head><body data-game="pinball"><header><a class="brand" href="../index.html"><img class="brand-logo" src="../assets/retro-universe-logo.svg" alt="Retro Universe"></a><span>ARCADE TABLE</span><a href="../classics.html">← CLASSICS</a></header><main class="game-shell"><a class="back" href="../classics.html">← GAME SELECT</a><h1>PIXEL <em>PINBALL</em></h1><p>Space / tap to launch. Left and right arrows or touch flippers. Keep the ball in play!</p><h3 id="hud">SCORE 0 · BALL 3</h3><canvas id="field" class="field" width="460" height="620" aria-label="Pinball table"></canvas><div class="controls"><button id="left">◀ LEFT FLIP</button><button id="launch">● LAUNCH</button><button id="right">RIGHT FLIP ▶</button><button id="new">↻ NEW GAME</button></div></main><script>
(()=>{const c=document.querySelector('#field'),g=c.getContext('2d'),hud=document.querySelector('#hud');let x=230,y=540,vx=2,vy=-5,score=0,balls=3,launched=false,keys={},best=Number(localStorage.getItem('pinball-best')||0),bumperLock=[0,0,0];const bumpers=[[110,220],[350,220],[230,310]],flips=()=>({l:keys.ArrowLeft||keys.l,r:keys.ArrowRight||keys.r});function reset(){x=400;y=550;vx=-2;vy=-5;launched=false}function newGame(){score=0;balls=3;bumperLock=[0,0,0];reset();draw()}function draw(){g.fillStyle='#101b35';g.fillRect(0,0,460,620);g.strokeStyle='#6e82ad';g.lineWidth=6;g.beginPath();g.moveTo(30,30);g.lineTo(30,550);g.lineTo(150,610);g.lineTo(310,610);g.lineTo(430,550);g.lineTo(430,30);g.stroke();bumpers.forEach(([bx,by])=>{g.fillStyle='#f8d848';g.beginPath();g.arc(bx,by,28,0,Math.PI*2);g.fill();g.fillStyle='#e84a5f';g.beginPath();g.arc(bx,by,13,0,Math.PI*2);g.fill()});g.strokeStyle='#78c850';g.lineWidth=14;g.beginPath();g.moveTo(120,530);g.lineTo(flips().l?205:180,510);g.moveTo(340,530);g.lineTo(flips().r?255:280,510);g.stroke();g.fillStyle='#fff0c2';g.beginPath();g.arc(x,y,10,0,Math.PI*2);g.fill();hud.textContent='SCORE '+score+' · BEST '+best+' · BALL '+balls+(launched?'':' · READY');}
function launch(){if(!launched){launched=true;vy=-7;vx=(Math.random()-.5)*4;loop()}}
function loop(){if(!launched)return;x+=vx;y+=vy;vy+=.12;if(x<40||x>420)vx*=-.9;if(y<40)vy=Math.abs(vy);for(let i=0;i<bumpers.length;i++){const [bx,by]=bumpers[i];if(bumperLock[i]>0)bumperLock[i]--;if(Math.hypot(x-bx,y-by)<38&&bumperLock[i]===0){vy=-Math.abs(vy)-1;vx+=(x-bx)*.08;score+=100;bumperLock[i]=12;if(score>=500&&window.RetroUniverseAchievement)window.RetroUniverseAchievement('PINBALL-500')}}best=Math.max(best,score);localStorage.setItem('pinball-best',String(best));if(y>500&&y<560&&x>120&&x<340){if(flips().l&&x<230||flips().r&&x>=230){vy=-Math.abs(vy)-2;score+=10}}if(y>610){balls--;if(balls>0)reset();else{launched=false;hud.textContent='GAME OVER · SCORE '+score}}draw();if(launched)requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();launch()}});addEventListener('keyup',e=>keys[e.key]=false);document.querySelector('#launch').onclick=launch;document.querySelector('#left').onpointerdown=()=>keys.l=true;document.querySelector('#right').onpointerdown=()=>keys.r=true;['pointerup','pointerleave','pointercancel'].forEach(ev=>{document.querySelector('#left').addEventListener(ev,()=>keys.l=false);document.querySelector('#right').addEventListener(ev,()=>keys.r=false)});c.addEventListener('pointerdown',launch);document.querySelector('#new').onclick=newGame;newGame()})();
</script><script src="../js/game-enhancements.js"></script><script src="../js/arcade-system.js"></script><script src="../js/universal-controls.js"></script></body></html>

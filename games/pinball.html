<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b35"><title>Pixel Pinball · Retro Universe</title><link rel="stylesheet" href="../style.css"><link rel="icon" href="../assets/favicon.svg"><link rel="manifest" href="../manifest.webmanifest"><style>.field{display:block;width:min(94vw,460px);max-height:72vh;aspect-ratio:3/4;margin:auto;border:4px solid var(--line);background:#101b35;touch-action:none}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px}.controls button{min-width:90px;min-height:48px;touch-action:none}.pin-stats{text-align:center;font-size:13px;color:var(--muted)}</style></head><body data-game="pinball"><header><a class="brand" href="../index.html"><img class="brand-logo" src="../assets/retro-universe-logo.svg" alt="Retro Universe"></a><span>ARCADE TABLE</span><a href="../classics.html">← CLASSICS</a></header><main class="game-shell"><a class="back" href="../classics.html">← GAME SELECT</a><h1>PIXEL <em>PINBALL</em></h1><p>Space / launch to serve. Hold left and right flippers or use arrow keys. Keep the ball in play!</p><h3 id="hud">SCORE 0 · BALL 3</h3><p id="record" class="pin-stats">BEST 0 · TABLE READY</p><canvas id="field" class="field" width="460" height="620" aria-label="Pinball table"></canvas><div class="controls"><button id="left">◀ LEFT FLIP</button><button id="launch">● LAUNCH</button><button id="right">RIGHT FLIP ▶</button><button id="pause">Ⅱ PAUSE</button><button id="new">↻ NEW GAME</button></div><p class="note">Keyboard: ← / → flippers, Space launches. Touch: hold flipper buttons.</p></main><script>(()=>{'use strict';const c=document.querySelector('#field'),g=c.getContext('2d'),hud=document.querySelector('#hud'),record=document.querySelector('#record'),W=460,H=620;let x=400,y=540,vx=0,vy=0,score=0,balls=3,launched=false,paused=false,over=false,keys={},raf=0,last=0,best=Number(localStorage.getItem('retro-pinball-best')||0),locks=[0,0,0];const bumpers=[[110,220],[350,220],[230,310]],left=document.querySelector('#left'),right=document.querySelector('#right');function resetBall(){x=400;y=545;vx=0;vy=0;launched=false}function newGame(){cancelAnimationFrame(raf);score=0;balls=3;locks=[0,0,0];paused=false;over=false;resetBall();render()}function flippers(){return{l:!!(keys.ArrowLeft||keys.l),r:!!(keys.ArrowRight||keys.r)}}function render(){g.fillStyle='#101b35';g.fillRect(0,0,W,H);g.strokeStyle='#6e82ad';g.lineWidth=7;g.beginPath();g.moveTo(30,25);g.lineTo(30,535);g.lineTo(145,610);g.lineTo(315,610);g.lineTo(430,535);g.lineTo(430,25);g.stroke();g.fillStyle='#263a61';g.fillRect(385,50,45,470);g.strokeStyle='#a98bff';g.lineWidth=3;g.strokeRect(385,50,45,470);bumpers.forEach(([bx,by],i)=>{g.fillStyle=locks[i]>0?'#a98bff':'#f8d848';g.beginPath();g.arc(bx,by,29,0,Math.PI*2);g.fill();g.fillStyle='#e84a5f';g.beginPath();g.arc(bx,by,13,0,Math.PI*2);g.fill()});const f=flippers();g.strokeStyle='#78c850';g.lineWidth=15;g.lineCap='round';g.beginPath();g.moveTo(125,535);g.lineTo(f.l?215:185,510);g.moveTo(335,535);g.lineTo(f.r?245:275,510);g.stroke();g.fillStyle='#fff0c2';g.beginPath();g.arc(x,y,10,0,Math.PI*2);g.fill();hud.textContent='SCORE '+score+' · BEST '+best+' · BALL '+balls;record.textContent=over?'GAME OVER · FINAL SCORE '+score:paused?'PAUSED':launched?'BALL IN PLAY':'READY TO LAUNCH';if(paused||over){g.fillStyle='#101522dd';g.fillRect(65,270,330,75);g.fillStyle='#fff';g.font='bold 23px monospace';g.textAlign='center';g.fillText(paused?'PAUSED':'GAME OVER',230,315)}}function launch(){if(over||paused||launched)return;launched=true;vx=-2.5+(Math.random()*1.4);vy=-8;last=performance.now();raf=requestAnimationFrame(loop)}function drain(){balls--;if(balls<=0){over=true;launched=false;if(score>best){best=score;localStorage.setItem('retro-pinball-best',String(best))}window.RetroUniverseAchievement?.('PINBALL-GAMEOVER')}else resetBall()}function loop(t){if(!launched||paused||over)return;const dt=Math.min(2,(t-last)/16.67||1);last=t;for(let step=0;step<dt;step++){x+=vx;y+=vy;vy+=.11;vx*=.999;if(x<42){x=42;vx=Math.abs(vx)*.82}if(x>418&&y<520){x=418;vx=-Math.abs(vx)*.82}if(y<35){y=35;vy=Math.abs(vy)*.8}for(let i=0;i<bumpers.length;i++){if(locks[i]>0)locks[i]--;const[bx,by]=bumpers[i],dx=x-bx,dy=y-by,dist=Math.hypot(dx,dy);if(dist<39&&locks[i]===0){const nx=dx/(dist||1),ny=dy/(dist||1),dot=vx*nx+vy*ny;if(dot<0){vx-=2*dot*nx;vy-=2*dot*ny}vx+=nx*1.4;vy-=2.5;score+=100;locks[i]=12;window.RetroUniverseAchievement?.('PINBALL-500')}}const f=flippers();if(y>490&&y<555&&x>100&&x<360){if(x<235&&f.l){vy=-Math.max(6,Math.abs(vy)+2);vx+=1.2;score+=10}else if(x>=235&&f.r){vy=-Math.max(6,Math.abs(vy)+2);vx-=1.2;score+=10}}if(y>625){drain();break}}if(score>best){best=score;localStorage.setItem('retro-pinball-best',String(best))}render();if(launched)raf=requestAnimationFrame(loop)}function togglePause(){if(over)return;paused=!paused;if(paused){cancelAnimationFrame(raf);render()}else if(launched){last=performance.now();raf=requestAnimationFrame(loop)}else render()}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' ')launch();if(e.key==='Escape')togglePause()});addEventListener('keyup',e=>keys[e.key]=false);function hold(btn,key){btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;btn.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev=>btn.addEventListener(ev,()=>keys[key]=false))}hold(left,'l');hold(right,'r');document.querySelector('#launch').onclick=launch;document.querySelector('#pause').onclick=togglePause;document.querySelector('#new').onclick=newGame;c.addEventListener('pointerdown',launch);document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused&&!over)togglePause()});newGame()})();</script><script src="../js/game-enhancements.js"></script><script src="../js/arcade-system.js"></script><script src="../js/universal-controls.js"></script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b35"><title>Pixel Checkers — Retro Universe</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../style.css">
<style>
.checkers-wrap{max-width:560px;margin:16px auto}.checkers-board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:1;border:5px solid var(--line,#4d4d70);background:#1c1a31;box-shadow:0 8px 24px #0005}.checker-square{position:relative;display:grid;place-items:center;min-width:0;min-height:0;border:0;padding:0;aspect-ratio:1;background:#e8d5ac;color:#161326;cursor:pointer}.checker-square.dark{background:#55496e}.checker-square:focus-visible{outline:3px solid #ffe66d;outline-offset:-4px;z-index:2}.checker-square.selected{box-shadow:inset 0 0 0 4px #ffe66d}.checker-square.legal:after{content:'';width:28%;height:28%;border-radius:50%;background:#a8ed75;box-shadow:0 0 0 2px #182033}.piece{display:grid;place-items:center;width:76%;height:76%;border-radius:50%;border:4px solid #fff8;box-shadow:inset 0 -5px #0004,0 3px #0006;font-size:clamp(12px,4vw,24px);font-weight:bold}.piece.red{background:#e64d68;color:#fff}.piece.black{background:#24243a;color:#fff}.checker-hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0}.checker-status{text-align:center;min-height:2.5em}.checker-help{font-size:.9rem;text-align:center;opacity:.85}.checker-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.checker-actions button{min-height:44px}
@media(max-width:420px){.checker-board{border-width:3px}.piece{border-width:2px}.checker-square.selected{box-shadow:inset 0 0 0 2px #ffe66d}}
</style></head>
<body data-game="checkers"><header><a class="brand" href="../index.html" aria-label="Retro Universe home"><img class="brand-logo" src="../assets/retro-universe-logo.svg" alt="Retro Universe"></a><span>CLASSIC CARTRIDGE · TWO PLAYERS</span><a href="../classics.html">← CLASSICS</a></header>
<main class="game-shell"><a class="back" href="../classics.html">← GAME SELECT</a><h1>PIXEL <em>CHECKERS</em></h1><div class="panel checkers-wrap"><div class="checker-hud"><strong id="red-score">RED · 12</strong><strong id="black-score">BLACK · 12</strong></div><p id="checker-status" class="checker-status" role="status">Red's turn. Select a piece.</p><div id="checkers-board" class="checkers-board" role="grid" aria-label="Checkers board"></div><p class="checker-help">Tap/click a piece, then a highlighted square. Captures are mandatory; chain captures continue. Kings move both ways.</p><div class="checker-actions"><button id="checker-new" type="button">↻ NEW GAME</button><button id="checker-clear" type="button">CLEAR SELECTION</button></div></div></main>
<script>
(()=>{'use strict';
const boardEl=document.querySelector('#checkers-board'),statusEl=document.querySelector('#checker-status'),redScore=document.querySelector('#red-score'),blackScore=document.querySelector('#black-score');
let board=[],turn='red',selected=null,moves=[],mustContinue=false,gameOver=false;
const dirs={red:[[-1,-1],[-1,1]],black:[[1,-1],[1,1]]};
function init(){board=Array.from({length:8},()=>Array(8).fill(null));for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2)board[r][c]={side:'black',king:false};for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2)board[r][c]={side:'red',king:false};turn='red';selected=null;moves=[];mustContinue=false;gameOver=false;render();say("Red's turn. Select a piece.")}
function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}
function capturesFrom(r,c){const p=board[r][c];if(!p)return[];const steps=p.king?[[-1,-1],[-1,1],[1,-1],[1,1]]:dirs[p.side];const out=[];for(const[dr,dc]of steps){const mr=r+dr,mc=c+dc,tr=r+2*dr,tc=c+2*dc;if(inside(tr,tc)&&board[mr][mc]&&board[mr][mc].side!==p.side&&!board[tr][tc])out.push({r:tr,c:tc,cap:{r:mr,c:mc}})}return out}
function normalFrom(r,c){const p=board[r][c];if(!p)return[];const steps=p.king?[[-1,-1],[-1,1],[1,-1],[1,1]]:dirs[p.side];return steps.map(([dr,dc])=>({r:r+dr,c:c+dc})).filter(m=>inside(m.r,m.c)&&!board[m.r][m.c])}
function allCaptures(side){const a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]?.side===side)for(const m of capturesFrom(r,c))a.push({from:{r,c},...m});return a}
function choose(r,c){if(gameOver)return;const p=board[r][c];if(selected&&moves.some(m=>m.r===r&&m.c===c)){moveTo(r,c);return}if(p?.side===turn&&(!mustContinue||selected&&selected.r===r&&selected.c===c)){selected={r,c};moves=capturesFrom(r,c);if(!moves.length&&!mustContinue)moves=normalFrom(r,c);render();return}if(!mustContinue){selected=null;moves=[];render()}}
function moveTo(r,c){const m=moves.find(x=>x.r===r&&x.c===c);if(!m)return;const p=board[selected.r][selected.c];board[r][c]=p;board[selected.r][selected.c]=null;if(m.cap){board[m.cap.r][m.cap.c]=null;window.RetroUniverseAchievement?.('CHECKERS-CAPTURE')}if((p.side==='red'&&r===0)||(p.side==='black'&&r===7)){if(!p.king)window.RetroUniverseAchievement?.('CHECKERS-KING');p.king=true;}selected={r,c};const more=capturesFrom(r,c);if(m.cap&&more.length){mustContinue=true;moves=more;render();say((turn==='red'?'Red':'Black')+' must continue the capture.');return}mustContinue=false;selected=null;moves=[];turn=turn==='red'?'black':'red';const remaining=board.flat().filter(x=>x?.side===turn).length;if(!remaining||!allCaptures(turn).length&&!board.some((row,rr)=>row.some((x,cc)=>x?.side===turn&&normalFrom(rr,cc).length))){gameOver=true;window.RetroUniverseAchievement?.('CHECKERS-WIN');render();say((turn==='red'?'Black':'Red')+' wins! Press New Game to play again.');return}render();say((turn==='red'?'Red':'Black')+"'s turn. "+(allCaptures(turn).length?'A capture is mandatory.':'Select a piece.'))}
function say(t){statusEl.textContent=t}
function render(){const forced=allCaptures(turn);boardEl.innerHTML='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){const sq=document.createElement('button');sq.type='button';sq.className='checker-square '+((r+c)%2?'dark':'light');sq.setAttribute('role','gridcell');sq.setAttribute('aria-label','Row '+(r+1)+', column '+(c+1)+(board[r][c]?' '+board[r][c].side+(board[r][c].king?' king':''):' empty'));if(selected?.r===r&&selected?.c===c)sq.classList.add('selected');if(moves.some(m=>m.r===r&&m.c===c))sq.classList.add('legal');const p=board[r][c];if(p){const piece=document.createElement('span');piece.className='piece '+p.side;piece.textContent=p.king?'♛':'';sq.append(piece)}sq.addEventListener('click',()=>choose(r,c));boardEl.append(sq)}redScore.textContent='RED · '+board.flat().filter(p=>p?.side==='red').length;blackScore.textContent='BLACK · '+board.flat().filter(p=>p?.side==='black').length}
document.querySelector('#checker-new').addEventListener('click',init);document.querySelector('#checker-clear').addEventListener('click',()=>{if(!mustContinue){selected=null;moves=[];render()}});
init();
})();
</script><script src="../js/game-enhancements.js"></script><script src="../js/arcade-system.js"></script></body></html>

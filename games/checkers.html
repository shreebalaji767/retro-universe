<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b35"><title>Pixel Checkers — Retro Universe</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../style.css">
<style>
.checkers-wrap{max-width:560px;margin:16px auto}.checkers-board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:1;border:5px solid var(--line,#4d4d70);background:#1c1a31;box-shadow:0 8px 24px #0005}.checker-square{position:relative;display:grid;place-items:center;min-width:0;min-height:0;border:0;padding:0;aspect-ratio:1;background:#e8d5ac;color:#161326;cursor:pointer}.checker-square.dark{background:#55496e}.checker-square:focus-visible{outline:3px solid #ffe66d;outline-offset:-4px;z-index:2}.checker-square.selected{box-shadow:inset 0 0 0 4px #ffe66d}.checker-square.legal:after{content:'';width:28%;height:28%;border-radius:50%;background:#a8ed75;box-shadow:0 0 0 2px #182033}.piece{display:grid;place-items:center;width:76%;height:76%;border-radius:50%;border:4px solid #fff8;box-shadow:inset 0 -5px #0004,0 3px #0006;font-size:clamp(12px,4vw,24px);font-weight:bold}.piece.red{background:#e64d68;color:#fff}.piece.black{background:#24243a;color:#fff}.checker-hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0}.checker-status{text-align:center;min-height:2.5em}.checker-help{font-size:.9rem;text-align:center;opacity:.85}.checker-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.checker-actions button{min-height:44px}
@media(max-width:420px){.checker-board{border-width:3px}.piece{border-width:2px}.checker-square.selected{box-shadow:inset 0 0 0 2px #ffe66d}}
</style></head>
<body data-game="checkers"><header><a class="brand" href="../index.html" aria-label="Retro Universe home"><img class="brand-logo" src="../assets/retro-universe-logo.svg" alt="Retro Universe"></a><span>CLASSIC CARTRIDGE · LOCAL / VS COMPUTER</span><a href="../classics.html">← CLASSICS</a></header>
<main class="game-shell"><a class="back" href="../classics.html">← GAME SELECT</a><h1>PIXEL <em>CHECKERS</em></h1><div class="panel checkers-wrap"><div class="checker-actions"><label for="checker-mode">PLAY MODE</label><select id="checker-mode"><option value="local">LOCAL 2 PLAYERS</option><option value="computer">VS COMPUTER</option></select></div><div class="checker-hud"><strong id="red-score">RED · 12</strong><strong id="black-score">BLACK · 12</strong><strong id="checker-wins">WINS · 0</strong></div><p id="checker-status" class="checker-status" role="status">Red's turn. Select a piece.</p><div id="checkers-board" class="checkers-board" role="grid" aria-label="Checkers board"></div><p class="checker-help">Tap/click a piece, then a highlighted square. Captures are mandatory; chain captures continue. Kings move both ways.</p><div class="checker-actions"><button id="checker-new" type="button">↻ NEW GAME</button><button id="checker-clear" type="button">CLEAR SELECTION</button></div></div></main>
<script>
(()=>{'use strict';
const boardEl=document.querySelector('#checkers-board'),statusEl=document.querySelector('#checker-status'),redScore=document.querySelector('#red-score'),blackScore=document.querySelector('#black-score');
let board=[],turn='red',selected=null,moves=[],mustContinue=false,gameOver=false,mode='local',aiBusy=false,aiTimers=[],wins=Number(localStorage.getItem('retro-checkers-wins')||0);
const dirs={red:[[-1,-1],[-1,1]],black:[[1,-1],[1,1]]};
function clearAITimers(){aiTimers.forEach(clearTimeout);aiTimers=[];aiBusy=false}
function scheduleAI(callback,delay){const timer=setTimeout(()=>{aiTimers=aiTimers.filter(id=>id!==timer);callback()},delay);aiTimers.push(timer);return timer}
function init(){clearAITimers();document.querySelector('#checker-wins').textContent='WINS · '+wins;mode=document.querySelector('#checker-mode').value;aiBusy=false;board=Array.from({length:8},()=>Array(8).fill(null));for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2)board[r][c]={side:'black',king:false};for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2)board[r][c]={side:'red',king:false};turn='red';selected=null;moves=[];mustContinue=false;gameOver=false;render();say(mode==='computer'?"Your turn (Red). Select a piece.":"Red's turn. Select a piece.")}
function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}
function capturesFrom(r,c){const p=board[r][c];if(!p)return[];const steps=p.king?[[-1,-1],[-1,1],[1,-1],[1,1]]:dirs[p.side];const out=[];for(const[dr,dc]of steps){const mr=r+dr,mc=c+dc,tr=r+2*dr,tc=c+2*dc;if(inside(tr,tc)&&board[mr][mc]&&board[mr][mc].side!==p.side&&!board[tr][tc])out.push({r:tr,c:tc,cap:{r:mr,c:mc}})}return out}
function normalFrom(r,c){const p=board[r][c];if(!p)return[];const steps=p.king?[[-1,-1],[-1,1],[1,-1],[1,1]]:dirs[p.side];return steps.map(([dr,dc])=>({r:r+dr,c:c+dc})).filter(m=>inside(m.r,m.c)&&!board[m.r][m.c])}
function allCaptures(side){const a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]?.side===side)for(const m of capturesFrom(r,c))a.push({from:{r,c},...m});return a}
function choose(r,c){if(gameOver||aiBusy||(mode==='computer'&&turn==='black'))return;const p=board[r][c];if(selected&&moves.some(m=>m.r===r&&m.c===c)){moveTo(r,c);return}if(p?.side===turn&&(!mustContinue||selected&&selected.r===r&&selected.c===c)){const mandatory=allCaptures(turn);if(!mustContinue&&mandatory.length&&!capturesFrom(r,c).length){say('A capture is mandatory — select a piece that can jump.');return}selected={r,c};moves=capturesFrom(r,c);if(!moves.length&&!mustContinue)moves=normalFrom(r,c);render();return}if(!mustContinue){selected=null;moves=[];render()}}
function moveTo(r,c){const m=moves.find(x=>x.r===r&&x.c===c);if(!m)return;const p=board[selected.r][selected.c];board[r][c]=p;board[selected.r][selected.c]=null;if(m.cap){board[m.cap.r][m.cap.c]=null;window.RetroUniverseAchievement?.('CHECKERS-CAPTURE')}const promoted=!p.king&&((p.side==='red'&&r===0)||(p.side==='black'&&r===7));if(promoted){window.RetroUniverseAchievement?.('CHECKERS-KING');p.king=true;}selected={r,c};const more=promoted?[]:capturesFrom(r,c);if(m.cap&&more.length){mustContinue=true;moves=more;render();say((turn==='red'?'Red':'Black')+' must continue the capture.');return}mustContinue=false;selected=null;moves=[];turn=turn==='red'?'black':'red';const remaining=board.flat().filter(x=>x?.side===turn).length;if(!remaining||!allCaptures(turn).length&&!board.some((row,rr)=>row.some((x,cc)=>x?.side===turn&&normalFrom(rr,cc).length))){gameOver=true;const winner=turn==='red'?'Black':'Red';if(winner==='Red'){wins++;localStorage.setItem('retro-checkers-wins',String(wins));document.querySelector('#checker-wins').textContent='WINS · '+wins;window.RetroUniverseAchievement?.('CHECKERS-WIN')}render();say(winner+' wins! Press New Game to play again.');return}render();say((mode==='computer'&&turn==='black'?'Computer':(turn==='red'?'Red':'Black'))+"'s turn. "+(allCaptures(turn).length?'A capture is mandatory.':'Select a piece.'));if(mode==='computer'&&turn==='black')scheduleAI(aiTurn,420)}
function captureOptionsFor(pos,r,c){const p=pos[r][c];if(!p)return[];const steps=p.king?[[-1,-1],[-1,1],[1,-1],[1,1]]:dirs[p.side],out=[];for(const[dr,dc]of steps){const mr=r+dr,mc=c+dc,tr=r+2*dr,tc=c+2*dc;if(inside(tr,tc)&&pos[mr][mc]&&pos[mr][mc].side!==p.side&&!pos[tr][tc])out.push({r:tr,c:tc,cap:{r:mr,c:mc}})}return out}
function maxCaptureChain(pos,r,c){const opts=captureOptionsFor(pos,r,c);if(!opts.length)return 0;let best=0;for(const m of opts){const next=pos.map(row=>row.map(p=>p?{...p}:null)),p=next[r][c];next[r][c]=null;next[m.cap.r][m.cap.c]=null;next[m.r][m.c]=p;const promoted=!p.king&&((p.side==='red'&&m.r===0)||(p.side==='black'&&m.r===7));if(promoted)p.king=true;best=Math.max(best,1+(promoted?0:maxCaptureChain(next,m.r,m.c)))}return best}
function threatened(pos,r,c,by){for(let rr=0;rr<8;rr++)for(let cc=0;cc<8;cc++)if(pos[rr][cc]?.side===by&&captureOptionsFor(pos,rr,cc).some(m=>m.r===r&&m.c===c))return true;return false}
function scoreComputerMove(m,isCapture){const next=board.map(row=>row.map(p=>p?{...p}:null)),p=next[m.from.r][m.from.c];next[m.from.r][m.from.c]=null;if(m.cap)next[m.cap.r][m.cap.c]=null;next[m.r][m.c]=p;const promoted=!p.king&&m.r===7;p.king=p.king||promoted;let score=isCapture?1000+maxCaptureChain(next,m.r,m.c)*100:0;score+=promoted?180:0;score+=(3.5-Math.abs(3.5-m.c))*5+(m.r*2);if(threatened(next,m.r,m.c,'red'))score-=isCapture?35:120;return score}
function bestComputerCapture(options){return options.slice().sort((a,b)=>scoreComputerMove(b,true)-scoreComputerMove(a,true))[0]}
function bestComputerMove(options){return options.slice().sort((a,b)=>scoreComputerMove(b,false)-scoreComputerMove(a,false))[0]}
function aiTurn(){if(gameOver||mode!=='computer'||turn!=='black')return;aiBusy=true;const captures=allCaptures('black');let pick;if(captures.length){pick=bestComputerCapture(captures);selected=pick.from;moves=capturesFrom(selected.r,selected.c);render();scheduleAI(()=>{if(gameOver||mode!=='computer'||turn!=='black')return;moveTo(pick.r,pick.c);if(mustContinue)scheduleAI(aiContinue,350);else aiBusy=false},350)}else{const options=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]?.side==='black')for(const m of normalFrom(r,c))options.push({from:{r,c},...m});if(!options.length){aiBusy=false;return}pick=bestComputerMove(options);selected=pick.from;moves=normalFrom(selected.r,selected.c);render();scheduleAI(()=>{if(gameOver||mode!=='computer'||turn!=='black')return;moveTo(pick.r,pick.c);aiBusy=false},350)}}
function aiContinue(){if(gameOver||!mustContinue){aiBusy=false;return}const opts=capturesFrom(selected.r,selected.c);if(!opts.length){aiBusy=false;return}const pick=bestComputerCapture(opts.map(m=>({from:selected,...m})));moves=opts;render();scheduleAI(()=>{if(gameOver||mode!=='computer'||turn!=='black')return;moveTo(pick.r,pick.c);if(mustContinue)scheduleAI(aiContinue,350);else aiBusy=false},350)}
function say(t){statusEl.textContent=t}
function render(){const forced=allCaptures(turn);boardEl.innerHTML='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){const sq=document.createElement('button');sq.type='button';sq.className='checker-square '+((r+c)%2?'dark':'light');sq.setAttribute('role','gridcell');sq.setAttribute('aria-label','Row '+(r+1)+', column '+(c+1)+(board[r][c]?' '+board[r][c].side+(board[r][c].king?' king':''):' empty'));if(selected?.r===r&&selected?.c===c)sq.classList.add('selected');if(moves.some(m=>m.r===r&&m.c===c))sq.classList.add('legal');const p=board[r][c];if(p){const piece=document.createElement('span');piece.className='piece '+p.side;piece.textContent=p.king?'♛':'';sq.append(piece)}sq.addEventListener('click',()=>choose(r,c));boardEl.append(sq)}redScore.textContent='RED · '+board.flat().filter(p=>p?.side==='red').length;blackScore.textContent='BLACK · '+board.flat().filter(p=>p?.side==='black').length}
document.querySelector('#checker-mode').addEventListener('change',init);document.querySelector('#checker-new').addEventListener('click',init);document.querySelector('#checker-clear').addEventListener('click',()=>{if(!mustContinue){selected=null;moves=[];render()}});
init();
})();
</script><script src="../js/game-enhancements.js"></script><script src="../js/arcade-system.js"></script></body></html>

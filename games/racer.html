<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b35"><title>Pixel Racer · Retro Universe</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../style.css"></head>
<body data-game="racer"><header><a href="../index.html"><b>RU</b> RETRO UNIVERSE</a><span>8-BIT ARCADE</span><a href="../index.html">← ARCADE</a></header><main class="game-shell"><a class="back" href="../index.html">← GAME SELECT</a><h1>PIXEL <em>RACER</em></h1><p class="muted">Dodge traffic. Survive as long as you can. Best score is saved on this device.</p><section class="panel"><div class="hud"><span>SCORE <b id="score">0</b></span><span id="status">PRESS START</span><span>BEST <b id="best">0</b></span></div><canvas id="game" width="360" height="520" aria-label="Pixel racing game"></canvas><div class="controls"><button id="start">▶ START / RESTART</button><button id="pause">Ⅱ PAUSE</button></div><div class="touch"><button class="left" data-move="-1">◀</button><button class="right" data-move="1">▶</button></div><p class="note">Keyboard: ← → or A/D. Touch: buttons or tap left/right side of track.</p></section></main><footer>RETRO UNIVERSE · PLAYER 1 <a href="../index.html">BACK TO ARCADE ↑</a></footer>
<script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d'),scoreEl=document.querySelector('#score'),status=document.querySelector('#status'),bestEl=document.querySelector('#best');let player=1,traffic=[],score=0,best=+(localStorage.getItem('racer-best')||0),running=false,paused=false,raf,last=0,spawn=0;bestEl.textContent=best;function reset(){cancelAnimationFrame(raf);player=1;traffic=[];score=0;spawn=0;last=0;running=true;paused=false;scoreEl.textContent='0';status.textContent='RACING';document.querySelector('#pause').textContent='Ⅱ PAUSE';raf=requestAnimationFrame(loop)}function move(d){if(running&&!paused)player=Math.max(0,Math.min(2,player+d))}function draw(){ctx.fillStyle='#687d49';ctx.fillRect(0,0,360,520);ctx.fillStyle='#303744';ctx.fillRect(42,0,276,520);ctx.fillStyle='#f7f0d5';ctx.fillRect(49,0,5,520);ctx.fillRect(306,0,5,520);for(let y=-40+(score*5%80);y<520;y+=80){ctx.fillStyle='#f7f0d5';ctx.fillRect(132,y,5,42);ctx.fillRect(222,y,5,42)}traffic.forEach(t=>car(t.lane,t.y,'#d94a4a'));car(player,420,'#f4c84a');if(!running){ctx.fillStyle='#101b35eF';ctx.fillRect(55,205,250,90);ctx.fillStyle='#fff0c2';ctx.textAlign='center';ctx.font='bold 19px monospace';ctx.fillText(score?'RACE OVER':'READY, RACER?',180,240);ctx.font='12px monospace';ctx.fillText('PRESS START',180,266)}if(paused){ctx.fillStyle='#101b35dd';ctx.fillRect(55,205,250,90);ctx.fillStyle='#fff0c2';ctx.textAlign='center';ctx.font='bold 20px monospace';ctx.fillText('PAUSED',180,255)}}function car(lane,y,color){let x=68+lane*91;ctx.fillStyle='#101b35';ctx.fillRect(x-3,y+4,48,65);ctx.fillStyle=color;ctx.fillRect(x,y,42,58);ctx.fillStyle='#fff0c2';ctx.fillRect(x+7,y+8,28,13);ctx.fillStyle='#101b35';ctx.fillRect(x+5,y+38,8,8);ctx.fillRect(x+29,y+38,8,8);ctx.fillStyle='#fff0c2';ctx.fillRect(x+5,y+1,8,4);ctx.fillRect(x+29,y+1,8,4)}function loop(t){if(!running)return;if(!paused){if(!last)last=t;let dt=Math.min(40,t-last);last=t;spawn+=dt;if(spawn>Math.max(360,850-score*2)){traffic.push({lane:Math.random()*3|0,y:-70});spawn=0}traffic.forEach(v=>v.y+=dt*(.16+Math.min(score/900,0.4)));traffic=traffic.filter(v=>v.y<550);score++;scoreEl.textContent=score;if(traffic.some(v=>v.lane===player&&v.y>365&&v.y<478)){running=false;status.textContent='CRASH!';if(score>best){best=score;localStorage.setItem('racer-best',best);bestEl.textContent=best}}}draw();if(running)raf=requestAnimationFrame(loop)}document.querySelector('#start').onclick=reset;document.querySelector('#pause').onclick=()=>{if(!running)return;paused=!paused;status.textContent=paused?'PAUSED':'RACING';document.querySelector('#pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';if(paused)cancelAnimationFrame(raf);else{last=0;raf=requestAnimationFrame(loop)}draw()};document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(+b.dataset.move));document.onkeydown=e=>{if(['ArrowLeft','ArrowRight','a','d','A','D',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if(e.key===' '&&!running)reset()};c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();move(e.clientX<r.left+r.width/2?-1:1)});draw()})();
</script><script>(()=>{const id=document.body.dataset.game;if(!id)return;try{const read=k=>JSON.parse(localStorage.getItem(k)||'[]');let played=read('retro-played');if(!Array.isArray(played))played=[];if(!played.includes(id))played.push(id);localStorage.setItem('retro-played',JSON.stringify(played));let recent=read('retro-recent');if(!Array.isArray(recent))recent=[];recent=[id,...recent.filter(x=>x!==id)].slice(0,8);localStorage.setItem('retro-recent',JSON.stringify(recent));const day=new Date().toISOString().slice(0,10),daily=['tetris','snake','2048','tic-tac-toe','racer','space-shooter','breakout','memory-match'][Number(day.replace(/-/g,''))%8];if(id===daily)localStorage.setItem('retro-daily-complete',JSON.stringify(day))}catch(e){}})()</script></body></html>

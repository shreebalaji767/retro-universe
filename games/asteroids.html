<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b35"><title>Asteroids — Retro Universe</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../style.css"><style>.gamecanvas{display:block;width:100%;max-width:760px;aspect-ratio:3/2;background:#080d20;border:4px solid var(--line);touch-action:none}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px}.controls button{min-width:58px;min-height:48px;touch-action:manipulation}.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}</style><link rel="manifest" href="../manifest.webmanifest"></head>
<body data-game="asteroids"><header><a class="brand" href="../index.html" aria-label="Retro Universe home"><img class="brand-logo" src="../assets/retro-universe-logo.svg" alt="Retro Universe"></a><span>SPACE ARCADE</span><a href="../index.html">← ARCADE</a></header><main style="max-width:820px;margin:auto;padding:18px"><p class="eyebrow">/// SURVIVE THE VOID</p><h1>PIXEL <em>ASTEROIDS</em></h1><p>Rotate, thrust and blast the rocks. Arrow keys or WASD to fly, Space to shoot. Touch buttons work on phones.</p><div class="hud"><strong id="status">SCORE 0 · LIVES 3</strong><button id="restart">↻ NEW RUN</button></div><canvas id="game" class="gamecanvas" width="720" height="480" aria-label="Asteroids game"></canvas><div class="controls"><button data-key="ArrowLeft">◀ TURN</button><button data-key="ArrowUp">▲ THRUST</button><button data-key="ArrowRight">TURN ▶</button><button data-key=" ">● FIRE</button></div><p class="muted">Tip: keep moving. Large asteroids split into smaller, faster rocks.</p></main><footer>RETRO UNIVERSE · <a href="../index.html">ARCADE HOME ↑</a></footer>
<script>
const c=document.querySelector('#game'),ctx=c.getContext('2d'),statusEl=document.querySelector('#status');let ship,rocks,shots,keys={},score,lives,over,last=0,raf;
const rnd=(a,b)=>a+Math.random()*(b-a);
function reset(){ship={x:360,y:240,a:-Math.PI/2,vx:0,vy:0,r:11,inv:100};rocks=[];shots=[];score=0;lives=3;over=false;for(let i=0;i<5;i++)rock(0);statusEl.textContent='SCORE 0 · LIVES 3';cancelAnimationFrame(raf);last=0;raf=requestAnimationFrame(loop)}
function rock(size,x,y){const r=size||rnd(22,34);rocks.push({x:x??rnd(0,720),y:y??rnd(0,480),r,a:rnd(0,6.28),spin:rnd(-.02,.02),vx:rnd(-1.4,1.4),vy:rnd(-1.4,1.4),size:r>25?2:r>15?1:0})}
function wrap(o){if(o.x<0)o.x+=720;if(o.x>720)o.x-=720;if(o.y<0)o.y+=480;if(o.y>480)o.y-=480}
function loop(t){const dt=Math.min(2,(t-last||16)/16);last=t;if(!over){if(keys.ArrowLeft||keys.a)ship.a-=.075*dt;if(keys.ArrowRight||keys.d)ship.a+=.075*dt;if(keys.ArrowUp||keys.w){ship.vx+=Math.cos(ship.a)*.14*dt;ship.vy+=Math.sin(ship.a)*.14*dt}ship.vx*=Math.pow(.99,dt);ship.vy*=Math.pow(.99,dt);ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;wrap(ship);ship.inv=Math.max(0,ship.inv-dt);
if((keys[' ']||keys.Space)&&!ship.cool){shots.push({x:ship.x+Math.cos(ship.a)*12,y:ship.y+Math.sin(ship.a)*12,vx:ship.vx+Math.cos(ship.a)*6,vy:ship.vy+Math.sin(ship.a)*6,life:55});ship.cool=10}ship.cool=Math.max(0,(ship.cool||0)-dt);
shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;wrap(s)});shots=shots.filter(s=>s.life>0);
rocks.forEach(r=>{r.x+=r.vx*dt;r.y+=r.vy*dt;r.a+=r.spin*dt;wrap(r)});for(let i=rocks.length-1;i>=0;i--){let r=rocks[i],hit=shots.findIndex(s=>Math.hypot(s.x-r.x,s.y-r.y)<r.r);if(hit>=0){shots.splice(hit,1);rocks.splice(i,1);score+=r.size===2?20:r.size===1?50:100;if(r.size>0){rock(r.r*.62,r.x,r.y);rock(r.r*.62,r.x,r.y)}}else if(!ship.inv&&Math.hypot(ship.x-r.x,ship.y-r.y)<r.r+8){lives--;ship.x=360;ship.y=240;ship.vx=ship.vy=0;ship.inv=100;if(lives<=0)over=true}}if(!rocks.length)for(let i=0;i<Math.min(12,5+Math.floor(score/200));i++)rock(0);statusEl.textContent='SCORE '+score+' · LIVES '+lives+(over?' · GAME OVER':'')}
ctx.fillStyle='#080d20';ctx.fillRect(0,0,720,480);ctx.fillStyle='#dce8ff';for(let i=0;i<65;i++){let x=(i*97)%720,y=(i*53)%480;ctx.fillRect(x,y,2,2)}ctx.strokeStyle='#e5e7ff';ctx.lineWidth=2;rocks.forEach(r=>{ctx.beginPath();for(let i=0;i<9;i++){let a=r.a+i*Math.PI*2/9,rad=r.r*(i%2?.82:1);let x=r.x+Math.cos(a)*rad,y=r.y+Math.sin(a)*rad;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke()});ctx.fillStyle='#ffe66d';shots.forEach(s=>ctx.fillRect(s.x-2,s.y-2,4,4));if(!over&&ship.inv%12<7){ctx.strokeStyle='#7be7ff';ctx.beginPath();ctx.moveTo(ship.x+Math.cos(ship.a)*14,ship.y+Math.sin(ship.a)*14);ctx.lineTo(ship.x+Math.cos(ship.a+2.5)*12,ship.y+Math.sin(ship.a+2.5)*12);ctx.lineTo(ship.x+Math.cos(ship.a-2.5)*12,ship.y+Math.sin(ship.a-2.5)*12);ctx.closePath();ctx.stroke()}if(over){ctx.fillStyle='#fff0c2';ctx.font='bold 32px monospace';ctx.textAlign='center';ctx.fillText('GAME OVER',360,230);ctx.font='16px monospace';ctx.fillText('PRESS NEW RUN',360,260)}raf=requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();keys[e.key]=true});addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();keys[k]=true},up=()=>keys[k]=false;b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});document.querySelector('#restart').onclick=reset;reset();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{})</script><script>(()=>{try{const id=document.body.dataset.game;let a=JSON.parse(localStorage.getItem('retro-played')||'[]');if(!Array.isArray(a))a=[];if(!a.includes(id))a.push(id);localStorage.setItem('retro-played',JSON.stringify(a));let r=JSON.parse(localStorage.getItem('retro-recent')||'[]');if(!Array.isArray(r))r=[];localStorage.setItem('retro-recent',JSON.stringify([id,...r.filter(x=>x!==id)].slice(0,8)));const d=new Date().toISOString().slice(0,10),list=['tetris','snake','2048','tic-tac-toe','racer','space-shooter','breakout','memory-match','platformer','maze-runner','pong','minesweeper','simon','asteroids','frogger','bomber-maze'];if(id===list[Number(d.replace(/-/g,''))%list.length])localStorage.setItem('retro-daily-complete',JSON.stringify(d))}catch(e){}})()</script><script src="../js/game-enhancements.js"></script></body></html>

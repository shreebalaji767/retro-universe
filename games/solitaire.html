<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Solitaire · Retro Universe</title><link rel="stylesheet" href="../style.css"><link rel="icon" href="../assets/favicon.svg"><style>.sol{display:grid;gap:10px;max-width:760px;margin:auto}.top,.cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.pile{min-height:100px;border:2px dashed #7584a8;border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:3px;align-items:stretch}.card{min-height:42px;border:2px solid #e8d5ac;border-radius:6px;background:#fff8e7;color:#18213a;font-weight:bold;font-size:clamp(13px,3vw,20px);touch-action:manipulation}.red{color:#d13e59}.pile button{width:100%}.pile .card{margin-bottom:-4px}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px}.pile:focus-within{outline:2px solid #f8d848}@media(max-width:500px){.top,.cols{gap:3px}.pile{padding:2px;min-height:70px}.card{min-height:34px;padding:2px}}</style></head><body data-game="solitaire"><header><a class="brand" href="../index.html"><img class="brand-logo" src="../assets/retro-universe-logo.svg" alt="Retro Universe"></a><span>SOLO CARD TABLE</span><a href="../classics.html">← CLASSICS</a></header><main class="game-shell"><a class="back" href="../classics.html">← GAME SELECT</a><h1>PIXEL <em>SOLITAIRE</em></h1><p class="muted">Klondike: build descending alternating-color columns and stack each suit from Ace to King.</p><div class="sol"><div class="top"><div id="stock" class="pile"></div><div id="waste" class="pile"></div><div class="pile"></div><div id="f0" class="pile"></div><div id="f1" class="pile"></div><div id="f2" class="pile"></div><div id="f3" class="pile"></div></div><div id="cols" class="cols"></div></div><p id="status" class="status" aria-live="polite">Draw a card to begin</p><div class="controls"><button id="draw">DRAW / RECYCLE</button><button id="new">↻ NEW DEAL</button><button id="undo">↶ UNDO</button></div></main><script>
(()=>{const suits=['♠','♥','♦','♣'],colsEl=document.querySelector('#cols'),status=document.querySelector('#status');let stock=[],waste=[],f=[[],[],[],[]],cols=Array.from({length:7},()=>[]),undo=null;const color=s=>s==='♥'||s==='♦',rank=c=>c.r,cardText=c=>c.r+suits[c.s],make=()=>suits.flatMap((_,s)=>Array.from({length:13},(_,i)=>({r:i+1,s,up:false})));
function snapshot(){undo=JSON.stringify({stock,waste,f,cols})}function restore(){if(undo){({stock,waste,f,cols}=JSON.parse(undo));undo=null;render();status.textContent='Move restored'}}
function init(){let deck=make();for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}stock=deck;waste=[];f=[[],[],[],[]];cols=Array.from({length:7},(_,i)=>stock.splice(0,i+1));cols.forEach(p=>p[p.length-1].up=true);undo=null;render();status.textContent='New deal — draw a card'}
function button(c,action){let b=document.createElement('button');b.className='card '+(color(suits[c.s])?'red':'');b.textContent=cardText(c);b.onclick=action;return b}
function render(){document.querySelector('#stock').innerHTML='';let sb=document.createElement('button');sb.className='card';sb.textContent=stock.length?'▧ '+stock.length:'↻';sb.onclick=()=>draw();document.querySelector('#stock').append(sb);document.querySelector('#waste').innerHTML='';if(waste.length)document.querySelector('#waste').append(button(waste[waste.length-1],()=>moveWaste()));f.forEach((p,i)=>{let el=document.querySelector('#f'+i);el.innerHTML='';let b=document.createElement('button');b.className='card';b.textContent=p.length?cardText(p[p.length-1]):'A→K';b.onclick=()=>moveFoundationToCol(i);el.append(b)});colsEl.innerHTML='';cols.forEach((p,i)=>{let el=document.createElement('div');el.className='pile';el.dataset.col=i;let b=document.createElement('button');b.className='card';b.textContent=p.length?'':'K ↓';b.onclick=()=>moveToCol(i);el.append(b);p.forEach((c,j)=>{let b=document.createElement('button');b.className='card '+(color(suits[c.s])?'red':'');b.textContent=c.up?cardText(c):'▧';b.onclick=()=>moveStack(i,j);el.append(b)});colsEl.append(el)})}
function draw(){snapshot();if(stock.length){let c=stock.pop();c.up=true;waste.push(c)}else if(waste.length){stock=waste.reverse().map(c=>({...c,up:false}));waste=[]}render();status.textContent='Draw or move a visible card'}
function moveWaste(){if(!waste.length)return;let c=waste[waste.length-1];if(moveToFoundation(c,waste)){snapshot();waste.pop();render();checkWin()}}
function moveToFoundation(c,from){let i=c.s,p=f[i],top=p[p.length-1];return c.r===(top?top.r+1:1)}
function moveFoundationToCol(i){if(!f[i].length)return;let c=f[i][f[i].length-1];for(let j=0;j<7;j++)if(canPlace(c,cols[j])){snapshot();f[i].pop();cols[j].push(c);render();return}}
function canPlace(c,p){let t=p[p.length-1];return t? t.up&&t.r===c.r+1&&color(suits[t.s])!==color(suits[c.s]):c.r===13}
function moveStack(i,j){let stack=cols[i].slice(j);if(!stack[0].up)return;for(let k=0;k<7;k++)if(k!==i&&canPlace(stack[0],cols[k])){snapshot();cols[i].splice(j);cols[k].push(...stack);if(cols[i].length)cols[i][cols[i].length-1].up=true;render();return}let c=stack[0],p=f[c.s],top=p[p.length-1];if(stack.length===1&&c.r===(top?top.r+1:1)){snapshot();cols[i].splice(j);p.push(c);if(cols[i].length)cols[i][cols[i].length-1].up=true;render();checkWin()}}
function moveToCol(i){if(!waste.length)return;let c=waste[waste.length-1];if(canPlace(c,cols[i])){snapshot();waste.pop();cols[i].push(c);render()}}
function checkWin(){if(f.every(p=>p.length===13))status.textContent='SOLITAIRE COMPLETE!';}
document.querySelector('#draw').onclick=draw;document.querySelector('#new').onclick=init;document.querySelector('#undo').onclick=restore;init()})();
</script><script src="../js/game-enhancements.js"></script><script src="../js/arcade-system.js"></script><script src="../js/universal-controls.js"></script></body></html>
